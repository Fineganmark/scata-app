<style>
/* Layout: one phone-width app column (max 440px) centred on a soft ground; header, scrolling screen, sticky action button. */
:root {

  --map-land: #20292a; --map-park: #23402b; --map-water: #1d3d52; --map-road: #34403f; --map-road-edge: #2a3433;

html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
#app { min-height: 100%; display: flex; justify-content: center; }
.phone { width: 100%; max-width: 440px; min-height: 100%; background: var(--bg); display: flex; flex-direction: column; position: relative; }
@media (min-width: 480px) { #app { padding-block: 24px; } .phone { min-height: calc(100vh - 48px); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; } }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

.logo { font-family: var(--font-logo); font-weight: 900; letter-spacing: .02em; color: var(--ink); display: flex; justify-content: center; gap: 1px; line-height: 1; user-select: none; }
.logo span { display: inline-block; }

.logo span:nth-child(4) { text-shadow: 3px 3px 0 var(--blue); }
.logo span:nth-child(5) { text-shadow: 3px 3px 0 var(--green); }
.logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.tagline { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.plus-bolt { color: var(--amber); margin-left: 6px; font-size: 26px; }

.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-block: 8px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hello { text-align: center; display: grid; gap: 2px; padding-top: 6px; }

.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.center { text-align: center; }

.card { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; }

.card.tint { background: linear-gradient(180deg, var(--bg), var(--amber-soft)); }

.row { display: flex; gap: 12px; align-items: center; min-width: 0; }

.grow { flex: 1; min-width: 0; }

.map { width: 100%; height: auto; display: block; border-radius: 14px; border: 1px solid var(--line); background: var(--map-land); }
.gmap { aspect-ratio: 380 / 360; max-width: 100%; overflow: hidden; }
.map-wrap { position: relative; }
.km { position: absolute; top: 10px; right: 10px; background: var(--blue); color: #fff; border-radius: 10px; padding: 6px 10px; font-weight: 800; text-align: center; line-height: 1.1; font-size: 18px; }

.cal-day { display: grid; }
.cal-head { display: flex; justify-content: space-between; background: var(--surface); padding: 8px 12px; font-weight: 700; font-size: 14px; }
.cal-slot { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
.cal-slot.mine { background: var(--green-soft); }
.cal-slot.picking { outline: 2px dashed var(--violet); outline-offset: -2px; }
.cal-who { display: flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
.dot.amber { background: var(--amber); }
.pill { border: 0; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 700; background: var(--green); color: #fff; white-space: nowrap; }
.pill.out { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
.pill.violet { background: var(--violet); }

.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 10px 2px; color: var(--ink-3); font-weight: 600; display: flex; gap: 8px; align-items: center; border-bottom: 2px solid transparent; margin-bottom: -1px; }

.profile-hero { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }

.table { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); }
.sharing { display: grid; justify-items: center; gap: 6px; color: var(--ink-2); font-size: 14px; }
.pulse { width: 22px; height: 22px; border-radius: 50%; background: #13b5a6; box-shadow: 0 0 0 0 rgba(19,181,166,.5); animation: pulse 1.6s infinite; }

.plus-card { background: linear-gradient(160deg, var(--amber-soft), var(--bg)); }
.feature { display: flex; gap: 10px; align-items: flex-start; }
.feature svg { width: 22px; height: 22px; color: var(--green); flex: none; margin-top: 1px; }
.maplink { display: flex; gap: 8px; align-items: center; justify-content: center; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); text-decoration: none; font-weight: 600; background: var(--bg); }

.demo-note { font-size: 12px; color: var(--ink-3); text-align: center; }

const SCHOOL_DAYS = 183, ROUND_KM = 10, EUR_PER_KM = 0.3, CO2_PER_KM = 0.17, MINS_PER_TRIP = 25;
function savings(mode, groupSize) {
  // Yearly estimate for one family: every school day has a drop-off and a pick-up.
  const trips = SCHOOL_DAYS * 2;
  const shareOfDriving = 1 / Math.max(1, groupSize);
  const carTripsAvoided = mode === 'car' ? trips * (1 - shareOfDriving) : trips;
  const km = carTripsAvoided * ROUND_KM;
  const hoursFreed = trips * (1 - shareOfDriving) * MINS_PER_TRIP / 60;
  return { eur: Math.round(km * EUR_PER_KM), co2: Math.round(km * CO2_PER_KM), hrs: Math.round(hoursFreed) };
}
function footprint(band) {
  const mid = { '0-100': 60, '100-200': 150, '200-400': 300, '400-800': 600, '800+': 900 }[band] || 150;
  const trips = Math.round(mid * 0.65 * 2 * 20 / 100) * 100;
  return { trips, co2: Math.round(trips * 0.5 / 100) * 100 };
}

function buildRota(state) {
  const members = ['me', ...state.families.filter(f => f.status === 'accepted').map(f => f.id)];
  const slots = [];
  DAYS.forEach((d, i) => ['drop', 'pick'].forEach(kind => slots.push({ id: d + kind, day: i, kind })));
  // Rotate so each family gets an even share; leftover trips go to different families each 4 weeks.
  slots.forEach((s, i) => { s.who = members[i % members.length]; s.confirmed = s.who !== 'me' && i % 3 !== 1; });
  return slots;
}

      if (!map.current) map.current = new gm.Map(el.current, { center: { lat: 53.33, lng: -6.29 }, zoom: 13, disableDefaultUI: true, zoomControl: true, gestureHandling: 'cooperative', clickableIcons: false });
      extras.current.forEach(x => x.setMap(null)); extras.current = [];
      const add = (x) => { extras.current.push(x); return x; };
      if (variant === 'catchment' || !origin) {
        new gm.Geocoder().geocode({ address: dest, region: 'ie' }, (res, status) => {
          if (dead) return;
          if (status !== 'OK' || !res[0]) { onFail && onFail(); return; }
          const c = res[0].geometry.location;
          map.current.setCenter(c); map.current.setZoom(variant === 'catchment' ? 13 : 15);
          add(new gm.Marker({ map: map.current, position: c, title: s.school.name }));
          if (variant === 'catchment') {
            add(new gm.Circle({ map: map.current, center: c, radius: 3000, strokeColor: '#ffab00', strokeOpacity: .9, strokeWeight: 2, fillColor: '#ffab00', fillOpacity: .15 }));
            add(new gm.Circle({ map: map.current, center: c, radius: 1000, strokeColor: '#00a76f', strokeWeight: 3, fillColor: '#00a76f', fillOpacity: .18 }));
          }
        });
        return;
      }
      const renderer = add(new gm.DirectionsRenderer({ map: map.current, suppressMarkers: false, preserveViewport: false, polylineOptions: { strokeColor: '#2c5cf0', strokeWeight: 5 } }));
      new gm.DirectionsService().route({ origin, destination: dest, travelMode: gm.TravelMode[GM_TRAVEL[travel]], region: 'ie' }, (res, status) => {
        if (dead) return;
        if (status !== 'OK') { onFail && onFail(); return; }
        renderer.setDirections(res);
        const leg = res.routes[0].legs[0];
        path.current = res.routes[0].overview_path || [];
        onInfo && onInfo({ km: Math.round(leg.distance.value / 100) / 10, mins: Math.round(leg.duration.value / 60) });
        if (variant === 'route') {
          const h = leg.start_location;
          [[.004, .006], [-.003, .008], [.006, -.004], [-.005, -.006]].forEach(([a, b]) => add(new gm.Marker({ map: map.current, position: { lat: h.lat() + a, lng: h.lng() + b }, title: 'A Scata family near you', icon: { path: gm.SymbolPath.CIRCLE, scale: 7, fillColor: '#9c3fd0', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 } })));
        }
        if (variant === 'live') {
          car.current = add(new gm.Marker({ map: map.current, position: pointAlong(path.current, progress), title: 'Car on the school run', icon: { path: gm.SymbolPath.CIRCLE, scale: 10, fillColor: '#ff5630', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 3 }, zIndex: 9 }));
        }
      });
    }, () => onFail && onFail());
    return () => { dead = true; };
  }, [variant, travel, dest, origin]);
  useEffect(() => { if (car.current && path.current.length) car.current.setPosition(pointAlong(path.current, progress)); }, [progress]);
  return html`<div ref=${el} class="map gmap" role="region" aria-label=${label || 'Google map'}></div>`;
}
function SmartMap(props) {
  const [failed, setFailed] = useState(false);
  if (!MAPS_KEY || failed) return html`<${MapView} variant=${props.variant} progress=${props.progress} label=${props.label} />`;
  return html`<${GoogleMap} ...${props} onFail=${() => setFailed(true)} />`;
}

/* ---------- charts ---------- */
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'];
const BARS = [47, 33, 40, 47, 40, 40, 70, 87, 35];
const EURO = [12, 14, 20, 38, 38, 38, 45, 50, 32];
const TIME = [8, 10, 18, 30, 44, 42, 54, 60, 36];
function ReportChart() {
  const W = 320, H = 220, L = 30, B = 24, T = 10, R = 8;
  const x = (i) => L + (i + .5) * (W - L - R) / MONTHS.length;
  const y = (v) => H - B - v / 100 * (H - B - T);
  const smooth = (arr) => arr.map((v, i) => { if (!i) return `M${x(0)} ${y(v)}`; const px = x(i - 1), cx = x(i); const mx = (px + cx) / 2; return `C${mx} ${y(arr[i - 1])} ${mx} ${y(v)} ${cx} ${y(v)}`; }).join(' ');
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Monthly savings, January to September">
    ${[0, 20, 40, 60, 80, 100].map(v => html`<g><line x1=${L} x2=${W - R} y1=${y(v)} y2=${y(v)} stroke="var(--line)" stroke-dasharray="3 4"/><text x=${L - 6} y=${y(v) + 4} text-anchor="end">${v}</text></g>`)}
    ${BARS.map((v, i) => html`<rect x=${x(i) - 4} y=${y(v)} width="8" height=${y(0) - y(v)} rx="2" fill="var(--green)"/>`)}
    <path d=${smooth(EURO) + ` L${x(8)} ${y(0)} L${x(0)} ${y(0)} Z`} fill="var(--amber)" fill-opacity=".1"/>
    <path d=${smooth(EURO)} fill="none" stroke="var(--amber)" stroke-width="2.5"/>
    <path d=${smooth(TIME)} fill="none" stroke="var(--blue)" stroke-width="2.5"/>
    <circle cx=${x(8)} cy=${y(TIME[8])} r="3.5" fill="var(--blue)"/><circle cx=${x(8)} cy=${y(EURO[8])} r="3.5" fill="var(--amber)"/>
    ${MONTHS.map((m, i) => html`<text x=${x(i)} y=${H - 6} text-anchor="middle">${m}</text>`)}
  </svg>`;
}
function Pie({ data }) {
  const total = data.reduce((a, d) => a + d.v, 0); let a0 = -Math.PI / 2; const r = 100, c = 110;
  return html`<svg class="chart" viewBox="0 0 220 220" role="img" aria-label="Trips by commute type" style="max-width:240px;justify-self:center">
    ${data.map(d => { const a1 = a0 + d.v / total * Math.PI * 2; const large = a1 - a0 > Math.PI ? 1 : 0;
      const p = `M${c} ${c} L${c + r * Math.cos(a0)} ${c + r * Math.sin(a0)} A${r} ${r} 0 ${large} 1 ${c + r * Math.cos(a1)} ${c + r * Math.sin(a1)} Z`;
      const mid = (a0 + a1) / 2; const lx = c + r * .62 * Math.cos(mid), ly = c + r * .62 * Math.sin(mid); a0 = a1;
      return html`<g><path d=${p} fill=${d.c} stroke="var(--bg)" stroke-width="2"/><text x=${lx} y=${ly + 4} text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">${Math.round(d.v / total * 100)}%</text></g>`; })}
  </svg>`;
}

/* ---------- app ---------- */
function App() {
  const [s, setS] = useState(load);
  const [drawer, setDrawer] = useState(false);
  const [toast, setToast] = useState('');
  const toastT = useRef();
  const update = (fn) => setS(prev => { const next = JSON.parse(JSON.stringify(prev)); fn(next); return next; });
  const go = (route) => { update(n => { n.route = route; }); setDrawer(false); try { document.querySelector('.phone').scrollIntoView(); window.scrollTo(0, 0); } catch (e) {} };
  const say = (msg) => { setToast(msg); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(''), 2600); };
  useEffect(() => save(s), [s]);

  // Simulated other parents: queued replies resolve after a short wait.
  useEffect(() => {
    const t = setInterval(() => {
      const now = Date.now();
      setS(prev => {
        const due = prev.events.filter(e => e.at <= now);
        if (!due.length) return prev;
        const n = JSON.parse(JSON.stringify(prev));
        n.events = n.events.filter(e => e.at > now);
        due.forEach(e => {
          if (e.type === 'invite') {
            const f = n.families.find(x => x.id === e.fam); if (!f || f.status !== 'pending') return;
            f.status = f.outcome;
            n.notifications.unshift({ id: uid(), kind: 'invite', text: `${f.name} ${f.outcome === 'accepted' ? 'accepted' : 'declined'} your invitation to share the school commute.`, at: now, read: false });
            if (f.outcome === 'accepted' && n.rota) n.rota = buildRota(n);
          }
          if (e.type === 'reply') {
            (n.chats[e.fam] = n.chats[e.fam] || []).push({ me: false, text: e.text, t: clock(new Date()) });
          }
          if (e.type === 'swap') {
            const f = n.families.find(x => x.id === e.fam);
            n.notifications.unshift({ id: uid(), kind: 'cal', text: `${f ? f.name : 'A parent'} agreed to swap: you now have ${e.label}.`, at: now, read: false });
            const slot = n.rota && n.rota.find(x => x.id === e.slot); if (slot) slot.confirmed = true;
          }
          if (e.type === 'update') {
            const slot = n.rota && n.rota.find(x => x.id === e.slot); if (slot) slot.confirmed = true;
            const f = n.families.find(x => x.id === e.fam);
            n.notifications.unshift({ id: uid(), kind: 'cal', text: `${f ? f.name : 'A parent'} confirmed their ${e.label} slot.`, at: now, read: false });
          }
        });
        return n;
      });
    }, 1000);
    return () => clearInterval(t);
  }, []);

  const ctx = { s, update, go, say, setDrawer };
  const r = s.route;
  const authed = s.user;
  const screens = {
    login: Login, register: Register, choice: Choice, schoolInfo: SchoolInfo, parentInfo: ParentInfo,
    schoolOverview: SchoolOverview, invite: InviteParents, schoolProfile: SchoolProfile, reports: Reports,
    setup: Setup, match: Match, terms: Terms, manage: Manage, calendar: Calendar, trip: NextTrip,
    profile: ParentProfile, commutes: Commutes, newChild: NewChild, notifications: Notifications, plus: Plus, live: Live,
  };
  const Screen = screens[r] || Login;
  const preAuth = ['login', 'register', 'choice', 'schoolInfo', 'parentInfo'].includes(r);
  const unread = s.notifications.filter(n => !n.read).length;
  const meName = authed ? (authed.role === 'school' ? `${s.school.first} ${s.school.last}` : `${s.parent.first} ${s.parent.last}`) : '';
  const plusOn = authed && authed.role === 'parent' && s.parent.plus;

  return html`<div class="phone">
    ${!preAuth && authed ? html`<header class="top">
      <button class="iconbtn" aria-label="Open menu" onClick=${() => setDrawer(true)}>${I.menu}</button>
      <${Logo} plus=${plusOn} />
      <button class="iconbtn" aria-label=${authed.role === 'parent' ? `Notifications, ${unread} unread` : 'Profile'} onClick=${() => go(authed.role === 'parent' ? 'notifications' : 'schoolProfile')}>
        <${Avatar} name=${meName} size="sm" />${authed.role === 'parent' && unread ? html`<span class="badge">${unread}</span>` : ''}
      </button>
    </header>` : ''}
    <${Screen} ...${ctx} />
    ${drawer ? html`<${Drawer} ...${ctx} meName=${meName} />` : ''}
    ${toast ? html`<div class="toast" role="status">${toast}</div>` : ''}
  </div>`;
}

function InviteParents({ s, update, go, say }) {
  const link = `scata.ie/${s.school.code}`;
  const [emails, setEmails] = useState('');
  const [err, setErr] = useState('');
  const copy = () => { navigator.clipboard.writeText('https://' + link).then(() => say('Link copied'), () => { const el = document.getElementById('invite-link'); const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); say('Link selected. Copy it from here.'); }); };
  const add = (e) => {
    e.preventDefault();
    const list = emails.split(/[\s,;]+/).filter(Boolean);
    const bad = list.filter(x => !/^\S+@\S+\.\S+$/.test(x));
    if (!list.length) { setErr('Enter at least one email address'); return; }
    if (bad.length) { setErr(`Check ${bad.join(', ')}: that isn’t an email address`); return; }
    update(n => list.forEach(email => { if (!n.parents.some(p => p.email === email)) n.parents.unshift({ id: uid(), name: email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()), email, status: 'invited' }); }));
    setEmails(''); setErr(''); say(`${list.length} invite${list.length > 1 ? 's' : ''} queued`);
  };
  const invited = s.parents.filter(p => p.status === 'invited').length;
  return html`<main class="screen">
    <div class="hello"><h1>Invite your parents</h1><p>${s.school.name}</p></div>
    <div class="card">
      <h3>Share your school link</h3>
      <p class="muted" style="margin:0">Send this link to parents by email, text or your school app. Parents use it to join your school on Scata.</p>
      <div class="copybox"><code id="invite-link">${link}</code><button class="btn green sm" onClick=${copy}>Copy</button></div>
    </div>
    <form class="card" onSubmit=${add}>
      <h3>Or invite by email</h3>
      <${Field} id="inv-emails" label="Parent emails" value=${emails} onInput=${v => { setEmails(v); setErr(''); }} hint="Separate several addresses with commas" err=${err} />
      <button class="btn" type="submit">Send invites</button>
      <p class="demo-note" style="margin:0">Demo: invites are added to your parents list, no email is sent yet.</p>
    </form>
    <div class="card flat row between" style="display:flex">
      <span><b>${s.parents.length}</b> parents · <b>${invited}</b> waiting to join</span>
      <button class="btn sm ghost" onClick=${() => go('schoolProfile')}>View list</button>
    </div>
  </main>`;

function Setup({ s, update, go }) {
  const c = s.commute;
  const set = (k, v) => update(n => { n.commute[k] = v; });
  return html`<main class="screen">

      </div>
      <div class="stack"><span class="center">How many children can you add to your commute?</span>
        <div class="choice">${[1, 2, 3, 4].map(k => html`<button class=${'seat' + (c.seats === k ? ' on' : '')} aria-pressed=${c.seats === k} aria-label=${k + ' children'} onClick=${() => set('seats', k)}>${k}</button>`)}</div>
      </div>
      <div class="stack" style="gap:18px"><span class="center">What time is the drop off and pick up?</span>
        <${Field} id="su-home" label="Home Eircode or address" value=${c.home || ''} onInput=${v => set('home', v)} hint="Used to plan your route to school in Google Maps" />
        <${Field} id="su-drop" label="Drop off time" value=${c.drop} onInput=${v => set('drop', v)} />

function Match({ s, update, go }) {

function Manage({ s, update, go, say }) {
  const accepted = s.families.filter(f => f.status === 'accepted');
  const kidsIn = accepted.reduce((a, f) => a + f.kids, 0);
  const capacity = s.commute.seats + 1;
  const used = Math.min(capacity, kidsIn + 1);
  const left = Math.max(0, capacity - used);
  const sv = savings(s.commute.mode, accepted.length + 1);
  const invite = (f) => {
    update(n => { const x = n.families.find(y => y.id === f.id); x.status = 'pending'; n.events.push({ at: Date.now() + 4000 + Math.random() * 3000, type: 'invite', fam: f.id }); });
    say(`Invite sent to ${f.name}`);
  };
  return html`<main class="screen">
    <${Hello} s=${s} />
    <div class="card center">
      <h3>Invite parents in your area</h3>
      <span class="muted small">Trip capacity: <b>${used}/${capacity}</b></span>
      <span class="muted small">${left ? `You can add ${left} more ${left === 1 ? 'child' : 'children'}` : 'Your commute is full'}</span>
    </div>
    ${s.families.map(f => html`<div class="person">
      <${Avatar} name=${f.name} />
      <div class="grow"><b>${f.name}</b><div class="muted small">${f.kids} ${f.kids === 1 ? 'child' : 'children'} · ${f.mins} min away</div></div>
      ${f.status === 'none' ? html`<button class="btn sm ghost" onClick=${() => invite(f)}>Invite</button>`
        : html`<span class=${'status ' + f.status}>${f.status === 'accepted' ? '✓ Accepted' : f.status === 'pending' ? 'Pending' : 'Declined'}</span>`}
    </div>`)}
    <div class="center stack" style="gap:4px"><h3>Build this commute?</h3><span class="muted">Sharing this commute with ${accepted.length} ${accepted.length === 1 ? 'family' : 'families'} could save you each year:</span></div>
    <div class="card"><${Stats} s=${sv} /></div>
    <${Action} disabled=${!accepted.length} onClick=${() => { update(n => { n.rota = buildRota(n); n.weekOffset = 0; }); go('calendar'); }}>${s.rota ? 'Rebuild rota' : 'Let’s Go!'}<//>
  </main>`;
}

function mondayOf(offset) {
  const d = new Date(); d.setHours(12, 0, 0, 0);
  const day = d.getDay(); const diff = day === 0 ? 1 : day === 6 ? 2 : 1 - day;
  d.setDate(d.getDate() + diff + offset * 7); return d;
}
function weekNo(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }

function Calendar({ s, update, go, say }) {
  const [swapFrom, setSwapFrom] = useState(null);
  if (!s.rota) return html`<main class="screen"><${Hello} s=${s} /><div class="card note"><h3>No rota yet</h3><p style="margin:0">Invite at least one family and build your commute to get a rota.</p></div><${Action} onClick=${() => go('manage')}>Invite families<//></main>`;
  const fam = (id) => id === 'me' ? { name: 'You' } : s.families.find(f => f.id === id) || { name: '?' };
  const members = 1 + s.families.filter(f => f.status === 'accepted').length;
  const mon = mondayOf(s.weekOffset);
  const dayDate = (i) => { const d = new Date(mon); d.setDate(d.getDate() + i); return d; };
  const times = { drop: s.commute.drop, pick: s.commute.pick };
  const per = (10 / members);
  const label = (slot) => `${DAYS[slot.day]} ${slot.kind === 'drop' ? 'drop-off' : 'pick-up'}`;
  const tapSlot = (slot) => {
    if (!swapFrom) return;
    if (slot.id === swapFrom) { setSwapFrom(null); return; }
    const a = s.rota.find(x => x.id === swapFrom);
    if (slot.who === 'me') { say('Pick a slot that another parent is doing'); return; }
    const other = slot.who;
    update(n => { const A = n.rota.find(x => x.id === a.id), B = n.rota.find(x => x.id === slot.id); A.who = other; B.who = 'me'; A.confirmed = false; B.confirmed = false; n.events.push({ at: Date.now() + 3500, type: 'swap', fam: other, slot: B.id, label: label(B) }); n.events.push({ at: Date.now() + 3600, type: 'update', fam: other, slot: A.id, label: label(A) }); });
    setSwapFrom(null); say(`Swap request sent to ${fam(other).name}`);
  };
  return html`<main class="screen">
    <div class="card note"><h3>Trip overview</h3><p style="margin:0">${members} families, 5 days: that’s ${per % 1 ? per.toFixed(1) : per} trips each!</p></div>
    ${swapFrom ? html`<div class="card flat" style="background:var(--surface)"><span><b>Swapping ${label(s.rota.find(x => x.id === swapFrom))}.</b> Tap the slot you’d like instead.</span><button class="btn sm ghost" onClick=${() => setSwapFrom(null)}>Cancel swap</button></div>` : ''}
    <div class="card" style="padding:0;gap:0;overflow:hidden">
      <div style="padding:14px 16px"><h3>Calendar</h3></div>
      <div class="cal-nav" style="padding:6px 8px 12px">
        <button class="iconbtn" aria-label="Previous week" onClick=${() => update(n => { n.weekOffset--; })}>${I.chevL}</button>
        <span>${mon.toLocaleDateString('en-IE', { month: 'long', year: 'numeric' })}, Week ${weekNo(mon)}</span>
        <button class="iconbtn" aria-label="Next week" onClick=${() => update(n => { n.weekOffset++; })}>${I.chevR}</button>
      </div>
      ${DAYS.map((d, i) => html`<div class="cal-day">
        <div class="cal-head"><span>${d}</span><span>${dayDate(i).toLocaleDateString('en-IE', { month: 'long', day: 'numeric', year: 'numeric' })}</span></div>
        ${s.rota.filter(x => x.day === i).map(slot => { const mine = slot.who === 'me';
          return html`<div class=${'cal-slot' + (mine ? ' mine' : '') + (swapFrom && !mine ? ' picking' : '')} onClick=${() => tapSlot(slot)}>
            <div class="cal-who"><span class="small" style="min-width:92px">${times[slot.kind]}</span><span class=${'dot' + (slot.confirmed ? '' : ' amber')}></span><span>${fam(slot.who).name}</span></div>
            <div class="row" style="gap:6px">${mine ? html`
              ${slot.confirmed ? html`<span class="status accepted small">Confirmed</span>` : html`<button class="pill" onClick=${e => { e.stopPropagation(); update(n => { n.rota.find(x => x.id === slot.id).confirmed = true; }); say('Slot confirmed'); }}>Confirm</button>`}
              <button class="pill violet" onClick=${e => { e.stopPropagation(); setSwapFrom(slot.id); }}>Swap</button>`
              : !slot.confirmed ? html`<button class="pill out" onClick=${e => { e.stopPropagation(); if (swapFrom) { tapSlot(slot); return; } update(n => { n.events.push({ at: Date.now() + 3000, type: 'update', fam: slot.who, slot: slot.id, label: label(slot) }); }); say(`Asked ${fam(slot.who).name} to confirm`); }}>Request update</button>` : ''}</div>
          </div>`; })}
      </div>`)}
    </div>
    <div class="card note">
      <p style="margin:0">We have generated a <b>random allocation</b>. As there isn’t always an even number of trips, we will propose a new allocation in 4 weeks.</p>
      <p style="margin:0">Tap <b>Confirm</b> on your slot. If a slot doesn’t work for you, tap <b>Swap</b> and pick another parent’s slot. Once they agree, both slots are confirmed.</p>
      <div class="row" style="justify-content:center;gap:16px;font-size:13px"><span class="row" style="gap:6px"><span class="dot"></span>Confirmed</span><span class="row" style="gap:6px"><span class="dot amber"></span>Waiting</span></div>
    </div>
    <${Action} onClick=${() => go('trip')}>Let’s Go!<//>
  </main>`;
}

function nextTrip(s) {
  if (!s.rota) return null;
  const now = new Date(); let day = now.getDay() - 1; // 0 = Monday
  let kind = now.getHours() < 9 ? 'drop' : now.getHours() < 14 ? 'pick' : 'drop';
  if (now.getHours() >= 14) day += 1;
  if (day < 0 || day > 4) { day = 0; kind = 'drop'; }
  return s.rota.find(x => x.day === day && x.kind === kind);
}

function NextTrip({ s, go }) {
  const [info, setInfo] = useState(null);
  const slot = nextTrip(s);
  if (!slot) return html`<main class="screen"><${Hello} s=${s} /><div class="card note"><h3>No trips yet</h3><p style="margin:0">Build your commute to see your next school trip.</p></div><${Action} onClick=${() => go('manage')}>Build my commute<//></main>`;
  const mine = slot.who === 'me';
  const f = mine ? null : s.families.find(x => x.id === slot.who);
  const t = slot.kind === 'drop' ? s.commute.drop.split('-')[0] : s.commute.pick.split('-')[0];
  return html`<main class="screen">
    <${Hello} s=${s} />
    <div class="card note">
      <h3>Next School Trip</h3>
      <p style="margin:0">${mine ? html`You’re doing <b>${slot.kind === 'drop' ? 'drop-off' : 'pick-up'}</b> on ${DAYS[slot.day]}. Leave at <b>${t}</b>.` : html`<b>${f.name}</b> is doing ${slot.kind === 'drop' ? 'drop-off' : 'pick-up'} on ${DAYS[slot.day]} at <b>${t}</b>.`}</p>
    </div>
    <${SmartMap} s=${s} variant="trip" onInfo=${setInfo} />
    <${MapLink} href=${gmDirections(s)}>Get directions in Google Maps<//>
    <div class="card">
      <div class="row between" style="display:flex"><span class="muted">Children travelling</span><b>${1 + s.families.filter(x => x.status === 'accepted').reduce((a, x) => a + x.kids, 0)}</b></div>
      <div class="row between" style="display:flex"><span class="muted">Journey</span><b>${info ? `${info.km} km · about ${info.mins} min` : '10 km · about 21 min'}</b></div>
    </div>
    <${Action} onClick=${() => go(s.parent.plus ? 'live' : 'plus')}>${s.parent.plus ? 'Live tracking' : 'Track it live with Scata Plus'}<//>
  </main>`;
}

function Plus({ s, update, go, say }) {
  const on = s.parent.plus;
  return html`<main class="screen">
    <div class="hello"><h1>Scata Plus ⚡</h1><p>Extra peace of mind on every trip</p></div>
    <div class="card plus-card" style="gap:16px">
      ${[['Live tracking', 'See the car on the map and how far away it is.'], ['In-commute chat', 'Message the parent doing the run without swapping numbers.'], ['Pick-up and arrival alerts', 'Get told the moment your child is collected and arrives at school.']].map(([a, b]) => html`<div class="feature">${I.check}<div><b>${a}</b><div class="muted">${b}</div></div></div>`)}
      <div class="center"><span style="font-size:30px;font-weight:800">€5.99</span><span class="muted"> / month</span></div>
    </div>
    <p class="demo-note">Demo: no payment is taken. You can turn Plus off again at any time.</p>
    <${Action} onClick=${() => { update(n => { n.parent.plus = !on; }); say(on ? 'Scata Plus turned off' : 'Welcome to Scata Plus'); if (!on) go('live'); }}>${on ? 'Turn off Scata Plus' : 'Start Scata Plus'}<//>
  </main>`;
}

function Live({ s, update, go, say }) {
  const [tab, setTab] = useState('track');
  const [p, setP] = useState(0);
  const [info, setInfo] = useState(null);
  const slot = nextTrip(s);
  const driverId = slot && slot.who !== 'me' ? slot.who : (s.families.find(f => f.status === 'accepted') || {}).id;
  const driver = s.families.find(f => f.id === driverId);
  const [chatWith, setChatWith] = useState(driverId);
  useEffect(() => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t = setInterval(() => setP(v => (v >= 1 ? 0 : Math.min(1, v + (reduce ? .05 : .005)))), reduce ? 2000 : 200);
    return () => clearInterval(t);
  }, []);
  if (!s.parent.plus) return html`<${Plus} s=${s} update=${update} go=${go} say=${say} />`;
  if (!driver) return html`<main class="screen"><div class="card note"><h3>No one to track yet</h3><p style="margin:0">Once a family accepts your invite, you can follow their trips here.</p></div><${Action} onClick=${() => go('manage')}>Invite families<//></main>`;
  const mins = Math.max(0, Math.round((info ? info.mins : 10) * (1 - p)));
  const tabs = html`<div class="tabs" style="justify-content:center"><button class=${'tab' + (tab === 'track' ? ' on' : '')} onClick=${() => setTab('track')}>${I.idcard}Live tracking</button><button class=${'tab' + (tab === 'chat' ? ' on' : '')} onClick=${() => setTab('chat')}>${I.heart}In-Commute chat</button></div>`;
  if (tab === 'chat') return html`<main class="screen">${tabs}<${Chat} s=${s} update=${update} fam=${chatWith} setFam=${setChatWith} /><${Action} onClick=${() => go('commutes')}>Go back to commutes<//></main>`;
  const first = driver.name.split(' ')[0];
  return html`<main class="screen">
    ${tabs}
    <div class="card note"><h3>Next School Trip</h3><p style="margin:0">${mins > 0 ? `${first} is on the way and ${mins} min away. Please get ready!` : `${first} has arrived at school. Everyone is safely in.`}</p></div>
    <${SmartMap} s=${s} variant="live" mode="car" progress=${p} onInfo=${setInfo} label=${`Live map showing ${first}'s car on the route to school`} />
    <div class="sharing"><span class="pulse"></span>Sharing location</div>
    <${MapLink} href=${gmDirections(s, 'car')}>Open this route in Google Maps<//>
    <${Action} onClick=${() => setTab('chat')}>Chat!<//>
  </main>`;
}

function Chat({ s, update, fam, setFam }) {
  const [text, setText] = useState('');
  const box = useRef();
  const f = s.families.find(x => x.id === fam);
  const msgs = s.chats[fam] || [];
  const accepted = s.families.filter(x => x.status === 'accepted');
  useEffect(() => { if (box.current) box.current.scrollTop = box.current.scrollHeight; }, [msgs.length]);
  const send = (e) => {
    e.preventDefault(); const t = text.trim(); if (!t) return;
    const replies = ['Perfect, thanks!', 'Grand, see you then.', 'No problem at all 👍', 'Thanks for letting me know!'];
    update(n => { (n.chats[fam] = n.chats[fam] || []).push({ me: true, text: t, t: clock(new Date()) }); n.events.push({ at: Date.now() + 2500, type: 'reply', fam, text: replies[Math.floor(Math.random() * replies.length)] }); });
    setText('');
  };
  if (!f) return '';
  return html`<div class="card" style="padding:0;gap:0">
    <div class="row" style="padding:14px 16px;border-bottom:1px solid var(--line)">
      <${Avatar} name=${f.name} />
      <div class="grow"><b>${f.name}</b><div class="small" style="color:var(--green)">Active now</div></div>
      ${accepted.length > 1 ? html`<select aria-label="Choose chat" value=${fam} onChange=${e => setFam(e.target.value)} style="border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg)">${accepted.map(a => html`<option value=${a.id} selected=${a.id === fam}>${a.name.split(' ')[0]}</option>`)}</select>` : ''}
    </div>
    <div ref=${box} class="stack" style="padding:16px;max-height:52vh;overflow-y:auto">
      ${!msgs.length ? html`<p class="muted center">Say hello to ${f.name.split(' ')[0]}.</p>` : ''}
      ${msgs.map(m => html`<div class=${'bubble-row' + (m.me ? ' me' : '')}><span class="small muted">${m.t}</span><div class="bubble">${m.text}</div></div>`)}
    </div>
    <form class="chat-input" style="padding:12px;border-top:1px solid var(--line)" onSubmit=${send}><input id="chat-text" placeholder="Write a message…" aria-label="Message" value=${text} onInput=${e => setText(e.target.value)} /><button class="btn sm" type="submit">Send</button></form>
  </div>`;
}

function ParentProfile({ s, update, go, say }) {
  const [tab, setTab] = useState('profile');
  const [q, setQ] = useState('');
  const name = `${s.parent.first} ${s.parent.last}`;
  const accepted = s.families.filter(f => f.status === 'accepted').length;
  const kids = s.parent.children.filter(c => c.name.toLowerCase().includes(q.toLowerCase()));
  const tabs = html`<div class="tabs"><button class=${'tab' + (tab === 'profile' ? ' on' : '')} onClick=${() => setTab('profile')}>${I.idcard}Profile</button><button class="tab" onClick=${() => go('manage')}>${I.heart}Manage commute</button></div>`;
  return html`<main class="screen">
    <div><h2 class="title">Parent profile</h2><div class="crumbs"><b>Dashboard</b>•<span>Profile</span></div></div>
    <${ProfileHero} name=${name} line1=${s.school.name} line2=${s.parent.plus ? 'Parent · Scata Plus' : 'Parent'} tabs=${tabs} />
    <div class="card"><${Stats} s=${savings(s.commute.mode, accepted + 1)} labels=${['saved a year', 'saved a year', 'saved a year']} /></div>
    <div class="stack">
      <div><h3>Children</h3><p class="muted small" style="margin:4px 0 0">Add and manage children</p></div>
      <div><button class="btn green" onClick=${() => go('newChild')}>${I.plus}Add child</button></div>
      <div class="table">
        <div class="search">${I.search}<input id="child-search" placeholder="Search…" aria-label="Search children" value=${q} onInput=${e => setQ(e.target.value)} /></div>
        <div class="trow thead" style="grid-template-columns:1fr auto 40px"><span>Name</span><span>Date of birth</span><span></span></div>
        ${kids.map(c => html`<div class="trow" style="grid-template-columns:1fr auto 40px"><span class="row" style="gap:10px"><${Avatar} name=${c.name} size="sm" />${c.name}</span><span style="font-variant-numeric:tabular-nums">${new Date(c.dob).toLocaleDateString('en-IE')}</span><button class="iconbtn" style="width:32px;height:32px" aria-label=${'Remove ' + c.name} onClick=${() => { update(n => { n.parent.children = n.parent.children.filter(x => x.id !== c.id); }); say(`${c.name} removed`); }}>✕</button></div>`)}
        <div class="tfoot"><span>${kids.length} of ${s.parent.children.length}</span></div>
      </div>
    </div>
  </main>`;
}

function NewChild({ update, go, say }) {
  const [f, setF] = useState({ name: '', dob: '', school: '' });
  const [tried, setTried] = useState(false);
  return html`<main class="screen">
    <div><h2 class="title">New child</h2><div class="crumbs"><b>Profile</b>•<span>Add child</span></div></div>
    <form class="card form" id="child-form" onSubmit=${e => { e.preventDefault(); setTried(true); if (!f.name || !f.dob) return; update(n => { n.parent.children.push({ id: uid(), name: f.name, dob: f.dob }); }); say(`${f.name} added`); go('profile'); }}>
      <${Field} id="nc-name" label="First name" value=${f.name} onInput=${v => setF({ ...f, name: v })} err=${tried && !f.name && 'Enter a name'} />
      <${Field} id="nc-dob" label="Date of birth" type="date" value=${f.dob} onInput=${v => setF({ ...f, dob: v })} err=${tried && !f.dob && 'Pick a date'} />
      <p class="small muted" style="margin:0">Children can view the app but can’t make changes. Photo ID can be added once Scata goes live.</p>
    </form>
    <div class="action"><button class="btn" type="submit" form="child-form">Add child</button></div>
  </main>`;
}

function Commutes({ s, go }) {
  const accepted = s.families.filter(f => f.status === 'accepted');
  const mine = s.rota ? s.rota.filter(x => x.who === 'me').length : 0;
  return html`<main class="screen">
    <div><h2 class="title">Commutes</h2><div class="crumbs"><b>Dashboard</b>•<span>Commutes</span></div></div>
    <div class="card">
      <div class="row"><span class="mode on" style="width:48px;height:48px;cursor:default">${MODE_ICON[s.commute.mode]}</span><div class="grow"><b>School run · ${s.school.name}</b><div class="muted small">${MODE_NAME[s.commute.mode]} · drop-off ${s.commute.drop} · pick-up ${s.commute.pick}</div></div></div>
      <div class="row between" style="display:flex"><span class="muted">Families sharing</span><b>${accepted.length + 1}</b></div>
      <div class="row between" style="display:flex"><span class="muted">Your trips this week</span><b>${mine} of 10</b></div>
      <div class="row" style="flex-wrap:wrap;gap:8px">${accepted.map(f => html`<span class="row" style="gap:6px;background:var(--surface);border-radius:20px;padding:4px 10px 4px 4px"><${Avatar} name=${f.name} size="sm" /><span class="small">${f.name}</span></span>`)}</div>
      <div class="row" style="gap:8px"><button class="btn sm ghost" onClick=${() => go('calendar')}>Calendar</button><button class="btn sm ghost" onClick=${() => go('manage')}>Manage</button><button class="btn sm ghost" onClick=${() => go('setup')}>Edit</button></div>
    </div>
    <button class="btn ghost" onClick=${() => go('setup')}>${'+ Set up another commute'}</button>
  </main>`;
}

function Notifications({ s, update, go }) {
  useEffect(() => { const t = setTimeout(() => update(n => n.notifications.forEach(x => { x.read = true; })), 1500); return () => clearTimeout(t); }, []);
  const ago = (at) => { const m = Math.round((Date.now() - at) / 60000); return m < 1 ? 'Just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
  const slot = nextTrip(s);
  const tripLine = slot ? (slot.who === 'me' ? `You’re doing ${slot.kind === 'drop' ? 'drop-off' : 'pick-up'} on ${DAYS[slot.day]}. Leave at ${(slot.kind === 'drop' ? s.commute.drop : s.commute.pick).split('-')[0]}.` : `${(s.families.find(f => f.id === slot.who) || {}).name} is doing ${slot.kind === 'drop' ? 'drop-off' : 'pick-up'} on ${DAYS[slot.day]}.`) : null;
  return html`<main class="screen">
    <div><h2 class="title">Notifications</h2><div class="crumbs"><b>Dashboard</b>•<span>Notifications</span></div></div>
    ${tripLine ? html`<button class="notif" style="background:var(--amber-soft);border:0;text-align:left" onClick=${() => go('trip')}><span class="ico">${I.route}</span><span><b>Next trip</b><div>${tripLine}</div></span></button>` : ''}
    <div class="stack" style="gap:4px">${s.notifications.map(n => html`<div class=${'notif' + (n.read ? '' : ' unread')}><span class="ico">${n.kind === 'cal' ? I.cal : I.mail}</span><div class="grow"><div>${n.text}</div><div class="small muted">${ago(n.at)}</div></div></div>`)}</div>
    ${!s.notifications.length ? html`<p class="muted center">You’re all caught up.</p>` : ''}
  </main>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>

</body>
</html>
