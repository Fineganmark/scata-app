html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }

.phone { width: 100%; max-width: 440px; min-height: 100%; background: var(--bg); display: flex; flex-direction: column; position: relative; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

.tagline { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-block: 8px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hello { text-align: center; display: grid; gap: 2px; padding-top: 6px; }

.small { font-size: 13px; }

.cal-slot.mine { background: var(--green-soft); }
.cal-slot.picking { outline: 2px dashed var(--violet); outline-offset: -2px; }
.cal-who { display: flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
.dot.amber { background: var(--amber); }
.pill { border: 0; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 700; background: var(--green); color: #fff; white-space: nowrap; }
.pill.out { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }

.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 10px 2px; color: var(--ink-3); font-weight: 600; display: flex; gap: 8px; align-items: center; border-bottom: 2px solid transparent; margin-bottom: -1px; }

.profile-hero { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }

.table { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

.copybox code { flex: 1; font-weight: 700; user-select: all; min-width: 0; overflow-wrap: anywhere; }
.plus-card { background: linear-gradient(160deg, var(--amber-soft), var(--bg)); }
.feature { display: flex; gap: 10px; align-items: flex-start; }
.feature svg { width: 22px; height: 22px; color: var(--green); flex: none; margin-top: 1px; }

          car.current = add(new gm.Marker({ map: map.current, position: carAt(), title: 'Car on the school run', icon: { path: gm.SymbolPath.CIRCLE, scale: 10, fillColor: '#ff5630', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 3 }, zIndex: 9 }));
        }
      }).catch(() => { if (!dead) onFail && onFail(); });
    }, () => onFail && onFail());
    return () => { dead = true; };
  }, [variant, travel, dest, startKey]);
  useEffect(() => { if (car.current && (carPos || path.current.length)) car.current.setPosition(carAt()); }, [progress, carPos && carPos.lat, carPos && carPos.lng]);
  return html`<div ref=${el} class="map gmap" role="region" aria-label=${label || 'Google map'}></div>`;
}
function SmartMap(props) {
  const [failed, setFailed] = useState(false);
  if (!MAPS_KEY || failed) return html`<${MapView} variant=${props.variant} progress=${props.progress} label=${props.label} />`;
  return html`<${GoogleMap} ...${props} onFail=${() => setFailed(true)} />`;
}

/* ---------- charts ---------- */
function Pie({ data }) {
  const total = data.reduce((a, d) => a + d.v, 0); let a0 = -Math.PI / 2; const r = 100, c = 110;
  return html`<svg class="chart" viewBox="0 0 220 220" role="img" aria-label="Trips by commute type" style="max-width:240px;justify-self:center">
    ${data.map(d => { const a1 = a0 + d.v / total * Math.PI * 2; const large = a1 - a0 > Math.PI ? 1 : 0;
      const p = `M${c} ${c} L${c + r * Math.cos(a0)} ${c + r * Math.sin(a0)} A${r} ${r} 0 ${large} 1 ${c + r * Math.cos(a1)} ${c + r * Math.sin(a1)} Z`;
      const mid = (a0 + a1) / 2; const lx = c + r * .62 * Math.cos(mid), ly = c + r * .62 * Math.sin(mid); a0 = a1;
      return html`<g><path d=${p} fill=${d.c} stroke="var(--bg)" stroke-width="2"/><text x=${lx} y=${ly + 4} text-anchor="middle" style="fill:#fff;font-size:12px;font-weight:700">${Math.round(d.v / total * 100)}%</text></g>`; })}
  </svg>`;
}

/* ---------- backend ---------- */
const CFG = window.SCATA_CONFIG || {};
const sb = (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
const SITE = location.origin + location.pathname;
async function q(promise) { const { data, error } = await promise; if (error) throw new Error(error.message); return data; }
const rpc = (name, args) => q(sb.rpc(name, args || {}));
const clock = (d) => `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')} ${d.getHours() < 12 ? 'AM' : 'PM'}`;
const ago = (t) => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? 'Just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function mondayOf(offset) {
  const d = new Date(); d.setHours(12, 0, 0, 0);
  const day = d.getDay(); const diff = day === 0 ? 1 : day === 6 ? 2 : 1 - day;
  d.setDate(d.getDate() + diff + offset * 7); return d;
}
function weekNo(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }
const slotLabel = (slot) => `${DAYS[slot.day]} ${slot.kind === 'drop' ? 'drop-off' : 'pick-up'}`;
async function geocode(address) {
  try {
    const gm = await loadMaps();
    return await new Promise(res => new gm.Geocoder().geocode({ address, region: 'ie' }, (r, st) => res(st === 'OK' && r[0] ? { lat: r[0].geometry.location.lat(), lng: r[0].geometry.location.lng() } : null)));
  } catch (e) { return null; }
}
// Shape the map helpers expect.
const mapState = (a) => ({ school: a.school || { name: '', eircode: '' }, commute: { home: (a.commute && a.commute.home) || '', mode: (a.commute && a.commute.mode) || 'car' } });
const initialCode = (() => { try { const c = new URLSearchParams(location.search).get('school'); if (c) sessionStorage.setItem('scata-code', c); return c || sessionStorage.getItem('scata-code') || ''; } catch (e) { return ''; } })();

/* ---------- app ---------- */
function App() {
  const [session, setSession] = useState(undefined);
  const [d, setD] = useState({ loaded: false });
  const [route, setRoute] = useState('login');
  const [drawer, setDrawer] = useState(false);
  const [toast, setToast] = useState('');
  const [busy, setBusy] = useState(false);
  const toastT = useRef();
  const say = (msg) => { setToast(msg); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(''), 3200); };
  const go = (r) => { setRoute(r); setDrawer(false); try { window.scrollTo(0, 0); } catch (e) {} };
  const uid = session && session.user.id;

  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((evt, s) => { setSession(s || null); if (evt === 'PASSWORD_RECOVERY') setRoute('newPassword'); });
    return () => sub.subscription.unsubscribe();
  }, []);

  const loadGroups = async (prev) => {
    const owned = await q(sb.from('commute_groups').select('*').eq('owner_id', uid));
    const mem = await q(sb.from('group_members').select('*').eq('parent_id', uid));
    const groups = [...owned.map(g => ({ id: g.id, mine: true, status: 'accepted' })), ...mem.map(m => ({ id: m.group_id, mine: false, status: m.status }))];
    const usable = groups.filter(g => g.status === 'accepted');
    const keep = prev && usable.some(g => g.id === prev) ? prev : (usable[0] ? usable[0].id : null);
    const people = {};
    for (const g of groups) people[g.id] = await rpc('group_people', { p_group: g.id });
    return { groups, gid: keep, people };
  };

  const load = async (initial) => {
    if (!uid) return;
    try {
      const profile = await q(sb.from('profiles').select('*').eq('id', uid).maybeSingle());
      if (!profile) { setD({ loaded: true, profile: null }); if (initial) setRoute(route === 'newPassword' ? 'newPassword' : 'choice'); return; }
      const school = profile.school_id ? await q(sb.from('schools').select('*').eq('id', profile.school_id).maybeSingle()) : null;
      const notifications = await q(sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(50));
      let extra = {};
      if (profile.role === 'parent') {
        const commute = await q(sb.from('commutes').select('*').eq('parent_id', uid).maybeSingle());
        const children = await q(sb.from('children').select('*').order('created_at'));
        extra = { commute, children, ...(await loadGroups(d.gid)) };
      }
      setD({ loaded: true, profile, school, notifications, ...extra });
      if (initial && route !== 'newPassword') setRoute(profile.role === 'school' ? 'schoolOverview' : (extra.commute && extra.commute.accepted_terms ? 'manage' : 'setup'));
    } catch (e) { say(e.message); setD(x => ({ ...x, loaded: true })); }
  };
  useEffect(() => { if (session) load(true); else if (session === null) { setD({ loaded: true }); if (!['register', 'checkEmail', 'forgot'].includes(route)) setRoute('login'); } }, [uid]);

  // Live updates: my notifications (invites, swaps, chat) refresh what I see.
  useEffect(() => {
    if (!uid || !d.profile) return;
    const ch = sb.channel('me-' + uid)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${uid}` }, (p) => { say(p.new.body); load(false); })
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, [uid, !!d.profile]);

  const a = {
    ...d, uid, session, route, go, say, busy, reload: () => load(false), setGid: (gid) => setD(x => ({ ...x, gid })),
    run: async (fn, ok) => { setBusy(true); try { const r = await fn(); if (ok) say(ok); return r; } catch (e) { say(e.message); throw e; } finally { setBusy(false); } },
  };

  if (!sb) return html`<div class="phone"><main class="screen" style="padding-top:28px"><div class="logo-wrap"><${Logo} size="lg" /></div><div class="card note"><h3>Scata isn’t connected to its database yet</h3><p style="margin:0">The site needs its Supabase address and public key in config.js.</p></div></main></div>`;
  if (session === undefined || (session && !d.loaded)) return html`<div class="phone"><main class="screen" style="padding-top:40px"><div class="logo-wrap"><${Logo} size="lg" /></div><p class="center muted">Loading…</p></main></div>`;

  const screens = {
    login: Login, register: Register, checkEmail: CheckEmail, forgot: Forgot, newPassword: NewPassword,
    choice: Choice, schoolInfo: SchoolInfo, parentInfo: ParentInfo,
    schoolOverview: SchoolOverview, invite: InviteParents, schoolProfile: SchoolProfile, reports: Reports,
    setup: Setup, match: Match, terms: Terms, manage: Manage, calendar: Calendar, trip: NextTrip,
    profile: ParentProfile, commutes: Commutes, newChild: NewChild, notifications: Notifications, plus: Plus, live: Live,
  };
  const signedOutOnly = ['login', 'register', 'checkEmail', 'forgot'];
  let r = route;
  if (!session && !signedOutOnly.includes(r)) r = 'login';
  if (session && signedOutOnly.includes(r)) r = d.profile ? (d.profile.role === 'school' ? 'schoolOverview' : 'manage') : 'choice';
  if (session && !d.profile && !['choice', 'schoolInfo', 'parentInfo', 'newPassword'].includes(r)) r = 'choice';
  if (d.profile && d.profile.role === 'school' && !['schoolOverview', 'invite', 'schoolProfile', 'reports', 'newPassword'].includes(r)) r = 'schoolOverview';
  if (d.profile && d.profile.role === 'parent' && ['schoolOverview', 'invite', 'schoolProfile', 'reports', 'choice', 'schoolInfo', 'parentInfo'].includes(r)) r = 'manage';
  const Screen = screens[r] || Login;
  const unread = (d.notifications || []).filter(n => !n.read).length;
  const meName = d.profile ? `${d.profile.first_name} ${d.profile.last_name}` : '';
  const showTop = !!d.profile;

  return html`<div class="phone">
    ${showTop ? html`<header class="top">
      <button class="iconbtn" aria-label="Open menu" onClick=${() => setDrawer(true)}>${I.menu}</button>
      <${Logo} plus=${d.profile.role === 'parent' && d.profile.plus} />
      <button class="iconbtn" aria-label=${`Notifications, ${unread} unread`} onClick=${() => go(d.profile.role === 'parent' ? 'notifications' : 'schoolProfile')}>
        <${Avatar} name=${meName} size="sm" />${unread ? html`<span class="badge">${unread}</span>` : ''}
      </button>
    </header>` : ''}
    <${Screen} a=${a} />
    ${drawer ? html`<${Drawer} a=${a} meName=${meName} close=${() => setDrawer(false)} />` : ''}
    ${toast ? html`<div class="toast" role="status">${toast}</div>` : ''}
  </div>`;
}

function Drawer({ a, meName, close }) {
  const school = a.profile.role === 'school';
  const items = school
    ? [['schoolOverview', 'Overview', I.home], ['invite', 'Invite parents', I.mail], ['schoolProfile', 'Parents', I.user], ['reports', 'Reports', I.chart]]
    : [['manage', 'My commute', I.home], ['calendar', 'Calendar', I.cal], ['trip', 'Next school trip', I.route], ['commutes', 'Commutes', I.car], ['profile', 'My profile', I.user], ['notifications', 'Notifications', I.bell], ...(a.profile.plus ? [['live', 'Live tracking and chat', I.route], ['plus', 'Scata Plus (on)', I.bolt]] : [['plus', 'Get Scata Plus', I.bolt]])];

  <nav class="drawer" aria-label="Main menu">
    <div class="me"><${Avatar} name=${meName} size="sm" /><div><b>${meName}</b><div class="small muted">${school ? 'School manager' : 'Parent'} · ${a.school ? a.school.name : ''}</div></div></div>
    ${items.map(([r, label, ico]) => html`<button class=${'navi' + (a.route === r ? ' on' : '')} onClick=${() => a.go(r)}>${ico}${label}</button>`)}

}

/* ---------- auth ---------- */
function AuthTop({ back, a }) {
  return html`${back ? html`<div class="row"><button class="iconbtn" aria-label="Back" onClick=${() => a.go(back)}>${I.back}</button></div>` : ''}
    <div class="logo-wrap"><${Logo} size="lg" /><span class="tagline">Safe, sustainable school commute</span></div>`;
}
const emailOk = (e) => /^\S+@\S+\.\S+$/.test(e.trim());

function Login({ a }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [show, setShow] = useState(false);
  const [err, setErr] = useState('');
  const submit = async (e) => {
    e.preventDefault(); setErr('');
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    if (error) setErr(/confirm/i.test(error.message) ? 'Please confirm your email first. Check your inbox for the link we sent.' : 'That email and password don’t match an account. Check them, or create an account.');
  };
  return html`<main class="screen" style="padding-top:28px">
    <${AuthTop} a=${a} />
    <div class="hello"><h1>Sign in to SCATA</h1><p style="font-style:normal">New user? <button class="link" onClick=${() => a.go('register')}>Create an account</button></p></div>
    <form class="form" onSubmit=${submit}>
      <${Field} id="login-email" label="Email address" type="email" value=${email} onInput=${v => { setEmail(v); setErr(''); }} autocomplete="email" />
      <div class="field">
        <label for="login-pw">Password</label>
        <input id="login-pw" type=${show ? 'text' : 'password'} value=${pw} onInput=${e => { setPw(e.target.value); setErr(''); }} autocomplete="current-password" style="padding-right:48px" />
        <button type="button" class="iconbtn" aria-label=${show ? 'Hide password' : 'Show password'} onClick=${() => setShow(!show)} style="position:absolute;right:4px;top:4px">${I.eye}</button>
        ${err ? html`<span class="err">${err}</span>` : ''}
      </div>
      <div style="text-align:right"><button type="button" class="link u" onClick=${() => a.go('forgot')}>Forgot password?</button></div>
      <button class="btn" type="submit" disabled=${!email || !pw}>Login</button>
    </form>
    ${initialCode ? html`<p class="small muted center">You’re joining with school code <b>${initialCode}</b>. Create an account to continue.</p>` : ''}
  </main>`;
}

function Register({ a }) {
  const [f, setF] = useState({ email: '', pw: '', pw2: '' });
  const [tried, setTried] = useState(false);
  const [err, setErr] = useState('');
  const errs = { email: !emailOk(f.email) ? 'Enter an email address like name@example.ie' : '', pw: f.pw.length < 8 ? 'Use at least 8 characters' : '', pw2: f.pw2 !== f.pw ? 'The passwords don’t match' : '' };
  const ok = !errs.email && !errs.pw && !errs.pw2;
  const submit = async (e) => {
    e.preventDefault(); setTried(true); setErr(''); if (!ok) return;
    const { data, error } = await sb.auth.signUp({ email: f.email.trim(), password: f.pw, options: { emailRedirectTo: SITE } });
    if (error) { setErr(/registered/i.test(error.message) ? 'An account already uses this email. Sign in instead.' : error.message); return; }
    if (!data.session) a.go('checkEmail');
  };
  return html`<main class="screen" style="padding-top:20px">
    <${AuthTop} a=${a} back="login" />
    <div class="hello"><h1>Create your account</h1><p style="font-style:normal">Already have one? <button class="link" onClick=${() => a.go('login')}>Sign in</button></p></div>
    <form class="form" onSubmit=${submit}>
      <${Field} id="reg-email" label="Email address" type="email" value=${f.email} onInput=${v => setF({ ...f, email: v })} err=${tried && errs.email} autocomplete="email" />
      <${Field} id="reg-pw" label="Password" type="password" value=${f.pw} onInput=${v => setF({ ...f, pw: v })} err=${tried && errs.pw} hint="At least 8 characters" autocomplete="new-password" />
      <${Field} id="reg-pw2" label="Confirm password" type="password" value=${f.pw2} onInput=${v => setF({ ...f, pw2: v })} err=${tried && errs.pw2} autocomplete="new-password" />
      ${err ? html`<span class="err">${err}</span>` : ''}
      <button class="btn" type="submit">Create account</button>
    </form>
    <p class="small muted center">By signing up you agree to the Scata terms of service and privacy policy.</p>
  </main>`;
}

function SchoolInfo({ a }) {
  const [f, setF] = useState({ first: '', last: '', eircode: '', name: '', students: '100-200', open: '08:30-09:30', close: '14:15-15:00' });

function ParentInfo({ a }) {
  const [f, setF] = useState({ first: '', last: '', code: initialCode, child: '', dob: '' });
  const [tried, setTried] = useState(false);
  const [err, setErr] = useState('');
  const set = (k) => (v) => { setErr(''); setF({ ...f, [k]: v }); };
  const ok = f.first && f.last && f.code.trim() && f.child && f.dob;
  const submit = async (e) => {
    e.preventDefault(); setTried(true); if (!ok || a.busy) return;
    try {
      await a.run(() => rpc('join_school', { p_code: f.code, p_first: f.first, p_last: f.last }));
      await a.run(() => q(sb.from('children').insert({ parent_id: a.uid, name: f.child, dob: f.dob })), 'Welcome to Scata');
      try { sessionStorage.removeItem('scata-code'); } catch (e) {}
      await a.reload(); a.go('setup');
    } catch (e) { setErr(e.message); }
  };
  return html`<main class="screen" style="padding-top:20px">
    <div class="row"><button class="iconbtn" aria-label="Back" onClick=${() => a.go('choice')}>${I.back}</button><div class="grow"><${Logo} /></div><span style="width:40px"></span></div>
    <h2 class="title center">Fill in your information</h2>
    <form class="form" onSubmit=${submit} id="parent-form">
      <div class="grid2">
        <${Field} id="pi-first" label="First name" value=${f.first} onInput=${set('first')} err=${tried && !f.first && 'Enter your first name'} />
        <${Field} id="pi-last" label="Surname" value=${f.last} onInput=${set('last')} err=${tried && !f.last && 'Enter your surname'} />
      </div>
      <${Field} id="pi-code" label="School code" value=${f.code} onInput=${set('code')} hint="From your school’s invite, e.g. sca1234" err=${(tried && !f.code.trim() && 'Enter your school’s code') || err} />
      <h3>Your child</h3>
      <div class="grid2">
        <${Field} id="pi-child" label="Child’s first name" value=${f.child} onInput=${set('child')} err=${tried && !f.child && 'Enter a name'} />
        <${Field} id="pi-dob" label="Date of birth" type="date" value=${f.dob} onInput=${set('dob')} err=${tried && !f.dob && 'Pick a date'} />

    <div class="action"><button class="btn" type="submit" form="parent-form" disabled=${a.busy}>${a.busy ? 'Joining…' : 'Let’s Go!'}</button></div>

}

/* ---------- school ---------- */
const inviteLink = (a) => `${SITE}?school=${a.school.code}`;

function SchoolOverview({ a }) {

function InviteParents({ a }) {
  const link = inviteLink(a);
  const [emails, setEmails] = useState('');
  const [err, setErr] = useState('');
  const [mailto, setMailto] = useState('');
  const copy = () => navigator.clipboard.writeText(link).then(() => a.say('Link copied'), () => { const el = document.getElementById('invite-link'); const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); a.say('Link selected. Copy it from here.'); });
  const add = async (e) => {
    e.preventDefault();
    const list = emails.split(/[\s,;]+/).filter(Boolean);
    const bad = list.filter(x => !emailOk(x));
    if (!list.length) { setErr('Enter at least one email address'); return; }
    if (bad.length) { setErr(`Check ${bad.join(', ')}: that isn’t an email address`); return; }
    await a.run(() => q(sb.from('school_invites').upsert(list.map(email => ({ school_id: a.school.id, email: email.toLowerCase() })), { onConflict: 'school_id,email', ignoreDuplicates: true })));
    const body = `Hello,\n\n${a.school.name} is using Scata to help families share the school run safely.\n\nJoin here: ${link}\nOur school code is ${a.school.code}.\n\nThanks,\n${a.profile.first_name} ${a.profile.last_name}`;
    setMailto(`mailto:?bcc=${encodeURIComponent(list.join(','))}&subject=${encodeURIComponent('Join ' + a.school.name + ' on Scata')}&body=${encodeURIComponent(body)}`);
    setEmails(''); setErr(''); a.say(`${list.length} parent${list.length > 1 ? 's' : ''} added to your list`);
  };
  return html`<main class="screen">
    <div class="hello"><h1>Invite your parents</h1><p>${a.school.name}</p></div>
    <div class="card">
      <h3>Share your school link</h3>
      <p class="muted" style="margin:0">Send this link to parents by email, text or your school app. It takes them straight to sign-up with your school code (<b>${a.school.code}</b>) filled in.</p>
      <div class="copybox"><code id="invite-link">${link}</code><button class="btn green sm" onClick=${copy}>Copy</button></div>
    </div>
    <form class="card" onSubmit=${add}>
      <h3>Invite by email</h3>
      <${Field} id="inv-emails" label="Parent emails" value=${emails} onInput=${v => { setEmails(v); setErr(''); }} hint="Separate several addresses with commas" err=${err} />
      <button class="btn" type="submit" disabled=${a.busy}>Add to my parents list</button>
      ${mailto ? html`<a class="maplink" href=${mailto}>${I.mail}Open my email with the invite written</a><p class="demo-note" style="margin:0">This opens your own email app with the parents in BCC. Check it and press send.</p>` : ''}
    </form>
    <${Action} onClick=${() => a.go('schoolProfile')}>View parents list<//>
  </main>`;
}

function ProfileHero({ name, line1, line2, tabs }) {
  return html`<div class="profile-hero">
    <div class="sky"><svg viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M0 40 C60 10 120 10 180 34 S300 20 400 30 V60 H0Z" fill="var(--green)" fill-opacity=".35"/><path d="M0 50 C80 30 160 46 240 40 S340 34 400 46 V60 H0Z" fill="var(--green)" fill-opacity=".55"/></svg></div>
    <div class="who"><${Avatar} name=${name} size="xl" /><b>${name}</b><span style="font-weight:600;color:var(--ink-2)">${line1}</span><span class="muted">${line2}</span></div>
    ${tabs}
  </div>`;
}

function SchoolProfile({ a }) {
  const [tab, setTab] = useState('parents');
  const [filter, setFilter] = useState('all');
  const [q2, setQ] = useState('');
  const [page, setPage] = useState(0);
  const [rows, setRows] = useState(null);
  useEffect(() => { rpc('school_parents').then(setRows, e => { a.say(e.message); setRows([]); }); }, []);
  const per = 5;
  const list = (rows || []).filter(p => (filter === 'all' || p.status === 'active') && ((p.name || '') + p.email).toLowerCase().includes(q2.toLowerCase()));
  const pages = Math.max(1, Math.ceil(list.length / per));
  const pg = Math.min(page, pages - 1);
  const shown = list.slice(pg * per, pg * per + per);
  const name = `${a.profile.first_name} ${a.profile.last_name}`;
  const tabs = html`<div class="tabs"><button class=${'tab' + (tab === 'profile' ? ' on' : '')} onClick=${() => setTab('profile')}>${I.idcard}Profile</button><button class=${'tab' + (tab === 'parents' ? ' on' : '')} onClick=${() => setTab('parents')}>${I.heart}Parents</button></div>`;
  return html`<main class="screen">
    <div><h2 class="title">School Profile</h2><div class="crumbs"><b>Dashboard</b>•<span>${tab === 'parents' ? 'Parents' : 'Profile'}</span></div></div>
    <${ProfileHero} name=${name} line1=${a.school.name} line2="School manager" tabs=${tabs} />
    ${tab === 'profile' ? html`<div class="card">
      ${[['Eircode', a.school.eircode], ['Students', a.school.students], ['Opening time', a.school.open_time], ['Closing time', a.school.close_time], ['School code', a.school.code], ['Email', a.session.user.email]].map(([k, v]) => html`<div class="row between" style="display:flex"><span class="muted">${k}</span><b style="overflow-wrap:anywhere;text-align:right">${v}</b></div>`)}
    </div>` : html`<div class="card">
      <div><h3>Parents List</h3><p class="muted small" style="margin:4px 0 0">Parents who joined, and emails you’ve invited</p></div>
      <div><button class="btn green" onClick=${() => a.go('invite')}>${I.plus}Invite parents</button></div>
      <div class="table">
        <div class="tabs" style="padding:0 12px;background:var(--surface)"><button class=${'tab' + (filter === 'all' ? ' on' : '')} onClick=${() => { setFilter('all'); setPage(0); }}>All</button><button class=${'tab' + (filter === 'active' ? ' on' : '')} onClick=${() => { setFilter('active'); setPage(0); }}>Joined</button></div>
        <div class="search">${I.search}<input id="parent-search" placeholder="Search…" aria-label="Search parents" value=${q2} onInput=${e => { setQ(e.target.value); setPage(0); }} /></div>
        <div class="trow thead" style="grid-template-columns:1fr auto"><span>Parent</span><span>Status</span></div>
        ${rows === null ? html`<div class="trow" style="grid-template-columns:1fr"><span class="muted">Loading…</span></div>` : ''}
        ${shown.map(p => html`<div class="trow" style="grid-template-columns:1fr auto"><span class="row" style="gap:10px"><${Avatar} name=${p.name || p.email} size="sm" /><span style="min-width:0;overflow-wrap:anywhere">${p.name ? html`<b>${p.name}</b><br/>` : ''}<span class="small muted">${p.email}</span></span></span><span class=${'status ' + (p.status === 'active' ? 'accepted' : 'pending')}>${p.status === 'active' ? 'Joined' : 'Invited'}</span></div>`)}
        ${rows && !shown.length ? html`<div class="trow" style="grid-template-columns:1fr"><span class="muted">${rows.length ? `No parents match “${q2}”.` : 'No parents yet. Share your school link to invite them.'}</span></div>` : ''}
        <div class="tfoot">
          <span>${list.length ? `${pg * per + 1}-${Math.min(list.length, pg * per + per)} of ${list.length}` : '0 of 0'}</span>
          <button class="iconbtn" style="width:32px;height:32px" aria-label="Previous page" disabled=${pg === 0} onClick=${() => setPage(pg - 1)}>${I.chevL}</button>
          <button class="iconbtn" style="width:32px;height:32px" aria-label="Next page" disabled=${pg >= pages - 1} onClick=${() => setPage(pg + 1)}>${I.chevR}</button>
        </div>
      </div>
    </div>`}
  </main>`;
}

function Reports({ a }) {
  const [st, setSt] = useState(null);
  useEffect(() => { rpc('school_stats').then(r => setSt(r[0] || null), e => a.say(e.message)); }, []);
  if (!st) return html`<main class="screen"><div><h2 class="title">School Reports</h2></div><p class="muted">Loading…</p></main>`;
  const est = ['walk', 'bike', 'bus'].reduce((acc, m) => { const sv = savings(m, 1); return { eur: acc.eur + sv.eur * st[m], co2: acc.co2 + sv.co2 * st[m], hrs: acc.hrs }; }, { eur: 0, co2: 0, hrs: 0 });
  const car = savings('car', 3);
  const total = { eur: est.eur + car.eur * st.car, co2: est.co2 + car.co2 * st.car, hrs: car.hrs * st.car };
  const modes = [['car', 'Car', 'var(--green)'], ['bike', 'Bike', 'var(--amber)'], ['bus', 'Public', 'var(--blue)'], ['walk', 'Walk', 'var(--red)']];
  const anyTrips = Number(st.commutes) > 0;
  return html`<main class="screen">
    <div><h2 class="title">School Reports</h2><div class="crumbs"><b>Dashboard</b>•<span>Reports</span></div></div>
    <div class="card"><div class="stats">
      <div>${I.parent}<span class="big">${st.parents}</span><span class="lbl">parents joined</span></div>
      <div>${I.route}<span class="big">${st.commutes}</span><span class="lbl">commutes set up</span></div>
      <div>${I.car}<span class="big">${st.groups}</span><span class="lbl">sharing groups</span></div>
    </div></div>
    <div class="card"><h3>Estimated yearly savings</h3><${Stats} s=${total} labels=${['a year', 'CO₂ a year', 'parent time']} /><p class="demo-note" style="margin:0">Estimate from each family’s chosen travel mode, 10 km round trip, 183 school days.</p></div>
    <div class="card">
      <h3>Commutes by travel type</h3>
      ${anyTrips ? html`<${Pie} data=${modes.filter(([k]) => Number(st[k]) > 0).map(([k, , c]) => ({ v: Number(st[k]), c }))} />
      <div class="legend">${modes.map(([k, l, c]) => html`<span><i style=${'background:' + c}></i>${l} (${st[k]})</span>`)}</div>` : html`<p class="muted" style="margin:0">This fills in once parents set up their commutes.</p>`}
    </div>
    <p class="demo-note">Monthly trends will appear here once trips are being logged.</p>
  </main>`;
}

/* ---------- parent ---------- */
function Hello({ a }) { return html`<div class="hello"><h1>Hi, ${a.profile.first_name}!</h1><p>${a.school ? a.school.name : ''}</p></div>`; }

function Setup({ a }) {
  const [c, setC] = useState({ ...a.commute });
  const set = (k, v) => setC({ ...c, [k]: v });
  const save = async () => {
    const changedHome = c.home !== a.commute.home || a.commute.lat == null;
    const pos = changedHome && c.home ? await geocode(c.home + ', Ireland') : null;
    const patch = { home: c.home, mode: c.mode, seats: c.seats, drop_time: c.drop_time, pick_time: c.pick_time, updated_at: new Date().toISOString(), ...(pos ? { lat: pos.lat, lng: pos.lng } : {}) };
    await a.run(() => q(sb.from('commutes').update(patch).eq('parent_id', a.uid)));
    if (changedHome && c.home && !pos) a.say('We couldn’t find that address on the map. Try adding the Eircode.');
    await a.reload(); a.go('match');
  };
  return html`<main class="screen">
    <${Hello} a=${a} />
    <div class="card" style="gap:18px">
      <h3 class="center">Before we reach out, we need to know a little bit more about your commute</h3>
      <div class="stack"><span class="center">How do you plan on sharing your commute?</span>
        <div class="choice">${['walk', 'bike', 'car', 'bus'].map(m => html`<div><button class=${'mode' + (c.mode === m ? ' on' : '')} aria-pressed=${c.mode === m} aria-label=${MODE_NAME[m]} onClick=${() => set('mode', m)}>${MODE_ICON[m]}</button><div class="choice-label">${{ walk: 'Walk', bike: 'Cycle', car: 'Car', bus: 'Bus' }[m]}</div></div>`)}</div>
      </div>
      <div class="stack"><span class="center">How many children can you add to your commute?</span>
        <div class="choice">${[1, 2, 3, 4].map(k => html`<button class=${'seat' + (c.seats === k ? ' on' : '')} aria-pressed=${c.seats === k} aria-label=${k + ' children'} onClick=${() => set('seats', k)}>${k}</button>`)}</div>
      </div>
      <div class="stack" style="gap:18px"><span class="center">Where do you leave from, and when?</span>
        <${Field} id="su-home" label="Home Eircode or address" value=${c.home || ''} onInput=${v => set('home', v)} hint="Only used to find families near you. Other parents never see it." />
        <${Field} id="su-drop" label="Drop off time" value=${c.drop_time} onInput=${v => set('drop_time', v)} />
        <${Field} id="su-pick" label="Pick up time" value=${c.pick_time} onInput=${v => set('pick_time', v)} />
      </div>
    </div>
    <div class="action"><button class="btn" disabled=${a.busy || !c.home} onClick=${save}>${a.busy ? 'Saving…' : 'Let’s Go!'}</button></div>
  </main>`;
}

function useNearby(a) {
  const [list, setList] = useState(null);
  const refresh = () => rpc('nearby_parents').then(setList, e => { a.say(e.message); setList([]); });
  useEffect(() => { refresh(); }, [a.groups && a.groups.length, JSON.stringify(a.people || {})]);
  return [list, refresh];
}

function Match({ a }) {
  const [mode, setMode] = useState(a.commute.mode);
  const [info, setInfo] = useState(null);
  const [nearby] = useNearby(a);
  const close = (nearby || []).filter(n => n.km == null || n.km <= 5);
  const kids = close.reduce((s, n) => s + Number(n.kids || 0), 0);
  const sv = savings(mode, Math.min(a.commute.seats, close.length) + 1);
  const ms = { ...mapState(a), commute: { ...mapState(a).commute, mode } };
  return html`<main class="screen">
    <${Hello} a=${a} />
    <div class="map-wrap"><${SmartMap} s=${ms} variant="trip" mode=${mode} onInfo=${setInfo} />${info ? html`<div class="km">${info.km}<small>km</small></div>` : ''}</div>
    <div class="card tint center" style="gap:14px">
      <p style="margin:0;font-size:16px">${nearby === null ? 'Looking for families near you…' : close.length ? html`There ${close.length === 1 ? 'is' : 'are'} <b>${close.length}</b> ${close.length === 1 ? 'family' : 'families'} (${kids} ${kids === 1 ? 'child' : 'children'}) within 5 km going to your school.` : 'No other families at your school have set up a commute yet. You can still set yours up now, and we’ll show them here as they join.'}</p>
      <p style="margin:0"><b>${MODE_NAME[mode]}</b> together could save you up to</p>
      <div class="choice">${['walk', 'bike', 'car', 'bus'].map(m => html`<button class=${'mode' + (mode === m ? ' on' : '')} aria-pressed=${mode === m} aria-label=${MODE_NAME[m]} onClick=${() => setMode(m)}>${MODE_ICON[m]}</button>`)}</div>
      <${Stats} s=${sv} labels=${['a year', 'CO₂ a year', 'a year']} />
      <p class="demo-note" style="margin:0">Estimate: 10 km round trip, 183 school days.</p>
    </div>
    <div class="action"><button class="btn" disabled=${a.busy} onClick=${async () => { if (mode !== a.commute.mode) await a.run(() => q(sb.from('commutes').update({ mode }).eq('parent_id', a.uid))); await a.reload(); a.go(a.commute.accepted_terms ? 'manage' : 'terms'); }}>Let’s Go!</button></div>
  </main>`;
}

function Terms({ a }) {
  const [ok, setOk] = useState(a.commute.accepted_terms);
  const car = a.commute.mode === 'car';
  const items = [
    [I.parent, 'You will always travel with your child.'],
    ...(car ? [[I.car, 'You confirm that your car is fit for purpose.'], [I.shield, 'You confirm that your vehicle is insured, and you have a full driving licence.']] : [[I.shield, 'You confirm that you will supervise the children in your group for the whole journey.']]),
    [I.heart, `By ticking below you agree that you are electing to ${car ? 'carpool' : 'share the commute'} with other parents.`],
  ];
  return html`<main class="screen">
    <${Hello} a=${a} />
    <div class="card" style="gap:18px">
      <h3 class="center">Safety is our Priority</h3>
      ${items.map(([ico, t]) => html`<div class="feature" style="gap:14px"><span style="width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none">${ico}</span><span>${t}</span></div>`)}
    </div>
    <label class="check" for="terms-ok"><input id="terms-ok" type="checkbox" checked=${ok} onChange=${e => setOk(e.target.checked)} />Please accept to build this commute</label>
    <div class="action"><button class="btn" disabled=${!ok || a.busy} onClick=${async () => { await a.run(() => q(sb.from('commutes').update({ accepted_terms: true }).eq('parent_id', a.uid))); await a.reload(); a.go('manage'); }}>Let’s Go!</button></div>
  </main>`;
}

function PendingInvites({ a }) {
  const pending = (a.groups || []).filter(g => !g.mine && g.status === 'pending');
  if (!pending.length) return '';
  return html`${pending.map(g => { const owner = (a.people[g.id] || []).find(p => p.is_owner) || { first_name: 'A parent', last_name: '' };
    return html`<div class="card" style="background:var(--green-soft);border-color:transparent">
      <div class="row"><${Avatar} name=${owner.first_name + ' ' + owner.last_name} /><div class="grow"><b>${owner.first_name} ${owner.last_name}</b> invited you to share the school commute.</div></div>
      <div class="row" style="gap:8px"><button class="btn green" disabled=${a.busy} onClick=${async () => { await a.run(() => rpc('respond_invite', { p_group: g.id, p_accept: true }), 'You joined the commute'); await a.reload(); }}>Accept</button><button class="btn sm ghost" disabled=${a.busy} onClick=${async () => { await a.run(() => rpc('respond_invite', { p_group: g.id, p_accept: false }), 'Invitation declined'); await a.reload(); }}>Decline</button></div>
    </div>`; })}`;
}

function GroupPicker({ a }) {
  const usable = (a.groups || []).filter(g => g.status === 'accepted');
  if (usable.length < 2) return '';
  const label = (g) => g.mine ? 'My commute' : `${((a.people[g.id] || []).find(p => p.is_owner) || {}).first_name || 'A parent'}’s commute`;
  return html`<div class="field"><label for="grp">Commute</label><select id="grp" onChange=${e => a.setGid(e.target.value)}>${usable.map(g => html`<option value=${g.id} selected=${g.id === a.gid}>${label(g)}</option>`)}</select></div>`;
}

function Manage({ a }) {
  const [nearby, refresh] = useNearby(a);
  const myGroup = (a.groups || []).find(g => g.mine);
  const members = myGroup ? (a.people[myGroup.id] || []).filter(p => !p.is_owner) : [];
  const accepted = members.filter(m => m.status === 'accepted');
  const capacity = a.commute.seats + 1;
  const kidsIn = accepted.reduce((s, m) => s + Number(m.kids || 0), 0) + (a.children || []).length;
  const left = Math.max(0, capacity - kidsIn);
  const inOther = (a.groups || []).filter(g => !g.mine && g.status === 'accepted');
  const sv = savings(a.commute.mode, Math.max(accepted.length, inOther.length ? (a.people[inOther[0].id] || []).filter(p => p.status === 'accepted').length - 1 : 0) + 1);
  const invite = async (n) => { await a.run(() => rpc('invite_parent', { p_target: n.parent_id }), `Invite sent to ${n.first_name}`); await a.reload(); refresh(); };
  const canRota = a.gid != null && (a.people[a.gid] || []).filter(p => p.status === 'accepted').length > 1;
  return html`<main class="screen">
    <${Hello} a=${a} />
    <${PendingInvites} a=${a} />
    <div class="card center">
      <h3>Invite parents in your area</h3>
      <span class="muted small">Trip capacity: <b>${Math.min(capacity, kidsIn)}/${capacity}</b></span>
      <span class="muted small">${left ? `You can add ${left} more ${left === 1 ? 'child' : 'children'}` : 'Your commute is full'}</span>
    </div>
    ${nearby === null ? html`<p class="muted center">Looking for families near you…</p>` : ''}
    ${nearby && !nearby.length ? html`<div class="card note"><p style="margin:0">No other families at ${a.school.name} have set up a commute yet. Ask your school to share the Scata link, and they’ll appear here.</p></div>` : ''}
    ${(nearby || []).map(n => html`<div class="person">
      <${Avatar} name=${n.first_name} />
      <div class="grow"><b>${n.first_name}</b><div class="muted small">${n.kids} ${Number(n.kids) === 1 ? 'child' : 'children'}${n.km != null ? ` · ${n.km} km away` : ''} · ${MODE_NAME[n.mode]}</div></div>
      ${n.status === 'none' ? html`<button class="btn sm ghost" disabled=${a.busy} onClick=${() => invite(n)}>Invite</button>`
        : n.status === 'declined' ? html`<span class="row" style="gap:6px"><span class="status declined">Declined</span><button class="pill out" disabled=${a.busy} onClick=${() => invite(n)}>Ask again</button></span>`
        : html`<span class=${'status ' + n.status}>${n.status === 'accepted' ? '✓ Accepted' : 'Pending'}</span>`}
    </div>`)}
    ${inOther.length ? html`<div class="card flat"><span>You’re also in ${inOther.map(g => ((a.people[g.id] || []).find(p => p.is_owner) || {}).first_name).join(' and ')}’s commute.</span></div>` : ''}
    <div class="center stack" style="gap:4px"><h3>Build this commute?</h3><span class="muted">Sharing the school run could save you each year:</span></div>
    <div class="card"><${Stats} s=${sv} /></div>
    <${Action} disabled=${!canRota} onClick=${() => a.go('calendar')}>${canRota ? 'See the rota' : 'Waiting for a family to accept'}<//>
  </main>`;
}

function useRota(a, offset) {
  const [slots, setSlots] = useState(null);
  const [err, setErr] = useState('');
  const mon = mondayOf(offset);
  const load = async () => {
    if (!a.gid) { setSlots([]); return; }
    setErr('');
    try {
      if (offset < 0) setSlots(await q(sb.from('rota_slots').select('*').eq('group_id', a.gid).eq('week_start', isoDate(mon)).order('day').order('kind')));
      else setSlots(await rpc('build_rota', { p_group: a.gid, p_week: isoDate(mon) }));
    } catch (e) { setErr(e.message); setSlots([]); }
  };
  useEffect(() => { load(); }, [a.gid, offset]);
  useEffect(() => {
    if (!a.gid) return;
    const ch = sb.channel('rota-' + a.gid + offset).on('postgres_changes', { event: '*', schema: 'public', table: 'rota_slots', filter: `group_id=eq.${a.gid}` }, () => load()).subscribe();
    return () => { sb.removeChannel(ch); };
  }, [a.gid, offset]);
  return { slots, err, mon, load };
}

function SwapRequests({ a, onDone }) {
  const [reqs, setReqs] = useState([]);
  const load = () => q(sb.from('swap_requests').select('*').eq('status', 'pending').eq('responder', a.uid)).then(setReqs, () => {});
  useEffect(() => { load(); }, [a.notifications && a.notifications.length]);
  const name = (id) => { for (const g of Object.values(a.people || {})) { const p = g.find(x => x.parent_id === id); if (p) return p.first_name; } return 'A parent'; };
  return html`${reqs.map(r => html`<div class="card" style="background:var(--surface)">
    <span><b>${name(r.requester)}</b> asked to swap a slot with you. Check the notification for the details.</span>
    <div class="row" style="gap:8px"><button class="btn green" disabled=${a.busy} onClick=${async () => { await a.run(() => rpc('respond_swap', { p_swap: r.id, p_accept: true }), 'Swap agreed'); load(); onDone(); }}>Agree</button><button class="btn sm ghost" disabled=${a.busy} onClick=${async () => { await a.run(() => rpc('respond_swap', { p_swap: r.id, p_accept: false }), 'Swap declined'); load(); onDone(); }}>Can’t do it</button></div>
  </div>`)}`;
}

function Calendar({ a }) {
  const [offset, setOffset] = useState(0);
  const [swapFrom, setSwapFrom] = useState(null);
  const { slots, err, mon, load } = useRota(a, offset);
  if (!a.gid) return html`<main class="screen"><${Hello} a=${a} /><div class="card note"><h3>No rota yet</h3><p style="margin:0">Once a family accepts your invite, or you accept theirs, your rota appears here.</p></div><${Action} onClick=${() => a.go('manage')}>Invite families<//></main>`;
  const people = a.people[a.gid] || [];
  const who = (id) => id === a.uid ? 'You' : ((people.find(p => p.parent_id === id) || {}).first_name || 'A parent');
  const members = people.filter(p => p.status === 'accepted').length;
  const per = members ? 10 / members : 0;
  const dayDate = (i) => { const x = new Date(mon); x.setDate(x.getDate() + i); return x; };
  const times = { drop: a.commute.drop_time, pick: a.commute.pick_time };
  const past = offset < 0;

    if (!swapFrom || past) return;

    await a.run(() => rpc('request_swap', { p_give: swapFrom, p_take: slot.id }), `Swap request sent to ${who(slot.parent_id)}`);

  };
  return html`<main class="screen">
    <${GroupPicker} a=${a} />
    <${SwapRequests} a=${a} onDone=${load} />
    <div class="card note"><h3>Trip overview</h3><p style="margin:0">${members} families, 5 days: that’s ${per % 1 ? per.toFixed(1) : per} trips each!</p></div>
    ${swapFrom ? html`<div class="card flat" style="background:var(--surface)"><span><b>Swapping your ${slotLabel(slots.find(x => x.id === swapFrom))}.</b> Tap the slot you’d like instead.</span><button class="btn sm ghost" onClick=${() => setSwapFrom(null)}>Cancel swap</button></div>` : ''}
    <div class="card" style="padding:0;gap:0;overflow:hidden">
      <div style="padding:14px 16px"><h3>Calendar</h3></div>
      <div class="cal-nav" style="padding:6px 8px 12px">
        <button class="iconbtn" aria-label="Previous week" onClick=${() => { setSwapFrom(null); setOffset(offset - 1); }}>${I.chevL}</button>
        <span>${mon.toLocaleDateString('en-IE', { month: 'long', year: 'numeric' })}, Week ${weekNo(mon)}</span>
        <button class="iconbtn" aria-label="Next week" onClick=${() => { setSwapFrom(null); setOffset(offset + 1); }}>${I.chevR}</button>
      </div>
      ${err ? html`<p class="muted" style="padding:0 16px 16px;margin:0">${err}</p>` : ''}
      ${slots === null ? html`<p class="muted" style="padding:0 16px 16px;margin:0">Loading…</p>` : ''}
      ${slots && !slots.length && !err ? html`<p class="muted" style="padding:0 16px 16px;margin:0">No rota for this week.</p>` : ''}
      ${slots && slots.length ? DAYS.map((dn, i) => html`<div class="cal-day">
        <div class="cal-head"><span>${dn}</span><span>${dayDate(i).toLocaleDateString('en-IE', { month: 'long', day: 'numeric' })}</span></div>
        ${slots.filter(x => x.day === i).sort((x, y) => x.kind < y.kind ? -1 : 1).map(slot => { const mine = slot.parent_id === a.uid;
          return html`<div class=${'cal-slot' + (mine ? ' mine' : '') + (swapFrom && !mine ? ' picking' : '')} onClick=${() => tapSlot(slot)}>
            <div class="cal-who"><span class="small" style="min-width:92px">${times[slot.kind]}</span><span class=${'dot' + (slot.confirmed ? '' : ' amber')}></span><span>${who(slot.parent_id)}</span></div>
            ${past ? '' : html`<div class="row" style="gap:6px">${mine ? html`
              ${slot.confirmed ? html`<span class="status accepted small">Confirmed</span>` : html`<button class="pill" onClick=${async e => { e.stopPropagation(); await a.run(() => rpc('confirm_slot', { p_slot: slot.id }), 'Slot confirmed'); load(); }}>Confirm</button>`}
              <button class="pill violet" onClick=${e => { e.stopPropagation(); setSwapFrom(slot.id); }}>Swap</button>`
              : !slot.confirmed && !swapFrom ? html`<button class="pill out" onClick=${async e => { e.stopPropagation(); await a.run(() => rpc('nudge_slot', { p_slot: slot.id }), `Asked ${who(slot.parent_id)} to confirm`); }}>Request update</button>` : ''}</div>`}
          </div>`; })}
      </div>`) : ''}
    </div>
    <div class="card note">
      <p style="margin:0">We share the trips out in turn. When the numbers don’t divide evenly, the extra trips move to a different family each week.</p>
      <p style="margin:0">Tap <b>Confirm</b> on your slot. If a slot doesn’t work for you, tap <b>Swap</b> and pick another parent’s slot. Once they agree, both slots are confirmed.</p>
      <div class="row" style="justify-content:center;gap:16px;font-size:13px"><span class="row" style="gap:6px"><span class="dot"></span>Confirmed</span><span class="row" style="gap:6px"><span class="dot amber"></span>Waiting</span></div>
    </div>
    ${(a.groups || []).some(g => g.mine && g.id === a.gid) && !past ? html`<button class="btn ghost" disabled=${a.busy} onClick=${async () => { await a.run(() => rpc('rebuild_rota', { p_group: a.gid, p_week: isoDate(mon) }), 'Rota rebuilt for this week'); load(); }}>Rebuild this week’s rota</button>` : ''}
    <${Action} onClick=${() => a.go('trip')}>Next school trip<//>
  </main>`;
}

function useNextTrip(a) {
  const [trip, setTrip] = useState(undefined);
  useEffect(() => {
    if (!a.gid) { setTrip(null); return; }
    (async () => {
      const now = new Date();
      const today = (now.getDay() + 6) % 7; // 0 = Monday
      const kindNow = now.getHours() < 10 ? 'drop' : now.getHours() < 15 ? 'pick' : null;
      for (const off of [0, 1]) {
        let slots;
        try { slots = await rpc('build_rota', { p_group: a.gid, p_week: isoDate(mondayOf(off)) }); } catch (e) { setTrip(null); return; }
        const order = (s) => s.day * 2 + (s.kind === 'pick' ? 1 : 0);
        const fromIdx = off > 0 ? -1 : today > 4 ? 99 : today * 2 + (kindNow === 'drop' ? 0 : kindNow === 'pick' ? 1 : 2) - 1;
        const next = slots.filter(s => order(s) > fromIdx).sort((x, y) => order(x) - order(y))[0];
        if (next) { setTrip({ ...next, weekOffset: off }); return; }
      }
      setTrip(null);
    })();
  }, [a.gid]);
  return trip;
}

function Live({ a }) {
  const [tab, setTab] = useState('track');
  const [locs, setLocs] = useState([]);
  const [sharing, setSharing] = useState(false);
  const [geoErr, setGeoErr] = useState('');
  const [info, setInfo] = useState(null);
  const [routeFrom, setRouteFrom] = useState(null);
  const watch = useRef(null), lastSent = useRef(0), lastRoute = useRef(0);
  const slot = useNextTrip(a);
  const gid = a.gid;
  useEffect(() => {
    if (!gid) return;
    const load = () => q(sb.from('locations').select('*').eq('group_id', gid)).then(setLocs, () => {});
    load();
    const ch = sb.channel('loc-' + gid).on('postgres_changes', { event: '*', schema: 'public', table: 'locations', filter: `group_id=eq.${gid}` }, load).subscribe();
    const t = setInterval(load, 30000);
    return () => { sb.removeChannel(ch); clearInterval(t); };
  }, [gid]);
  const stop = async () => { if (watch.current != null) navigator.geolocation.clearWatch(watch.current); watch.current = null; setSharing(false); try { await q(sb.from('locations').delete().eq('group_id', gid).eq('parent_id', a.uid)); } catch (e) {} };
  useEffect(() => () => { if (watch.current != null) { navigator.geolocation.clearWatch(watch.current); sb.from('locations').delete().eq('group_id', gid).eq('parent_id', a.uid).then(() => {}); } }, []);
  const start = () => {
    setGeoErr('');
    if (!navigator.geolocation) { setGeoErr('This browser can’t share location.'); return; }
    watch.current = navigator.geolocation.watchPosition(async (p) => {
      setSharing(true);
      if (Date.now() - lastSent.current < 10000) return;
      lastSent.current = Date.now();
      try { await q(sb.from('locations').upsert({ group_id: gid, parent_id: a.uid, lat: p.coords.latitude, lng: p.coords.longitude, updated_at: new Date().toISOString() })); } catch (e) { setGeoErr(e.message); }
    }, (e) => { setSharing(false); setGeoErr(e.code === 1 ? 'Location is blocked. Allow location for this site in your browser settings, then try again.' : 'We couldn’t get your location. Try again outside or with Wi-Fi on.'); }, { enableHighAccuracy: true, maximumAge: 5000 });
  };
  const fresh = locs.filter(l => l.parent_id !== a.uid && Date.now() - new Date(l.updated_at) < 15 * 60000);
  const driverLoc = (slot && fresh.find(l => l.parent_id === slot.parent_id)) || fresh[0];
  const name = (id) => ((a.people[gid] || []).find(p => p.parent_id === id) || {}).first_name || 'A parent';
  const carPos = driverLoc ? { lat: driverLoc.lat, lng: driverLoc.lng } : null;
  useEffect(() => { if (carPos && Date.now() - lastRoute.current > 60000) { lastRoute.current = Date.now(); setRouteFrom(carPos); } }, [driverLoc && driverLoc.updated_at]);
  if (!a.profile.plus) return html`<${Plus} a=${a} />`;
  if (!gid) return html`<main class="screen"><div class="card note"><h3>No one to track yet</h3><p style="margin:0">Once a family joins your commute, you can follow the school run here.</p></div><${Action} onClick=${() => a.go('manage')}>Invite families<//></main>`;
  const tabs = html`<div class="tabs" style="justify-content:center"><button class=${'tab' + (tab === 'track' ? ' on' : '')} onClick=${() => setTab('track')}>${I.idcard}Live tracking</button><button class=${'tab' + (tab === 'chat' ? ' on' : '')} onClick=${() => setTab('chat')}>${I.heart}In-Commute chat</button></div>`;
  if (tab === 'chat') return html`<main class="screen">${tabs}<${GroupPicker} a=${a} /><${Chat} a=${a} /><${Action} onClick=${() => a.go('commutes')}>Go back to commutes<//></main>`;
  const ms = mapState(a);
  return html`<main class="screen">
    ${tabs}
    <${GroupPicker} a=${a} />
    <div class="card note"><h3>School run</h3><p style="margin:0">${driverLoc
      ? `${name(driverLoc.parent_id)} is sharing their location${info ? `, about ${info.mins} min from school` : ''}. Updated ${ago(driverLoc.updated_at).toLowerCase()}.`
      : sharing ? 'You’re sharing your location with your commute.' : 'No one is sharing their location right now. The parent doing the run can start sharing below.'}</p></div>
    ${carPos ? html`<${SmartMap} s=${ms} variant="live" mode="car" carPos=${carPos} from=${routeFrom} onInfo=${setInfo} progress=${.5} label=${`Live map showing ${name(driverLoc.parent_id)}'s position`} />` : html`<${SmartMap} s=${ms} variant="trip" />`}
    <div class="sharing">${sharing ? html`<span class="pulse"></span>Sharing your location` : ''}</div>
    ${geoErr ? html`<p class="err center" style="margin:0">${geoErr}</p>` : ''}
    ${sharing ? html`<button class="btn ghost" onClick=${stop}>Stop sharing my location</button>` : html`<button class="btn ghost" onClick=${start}>${I.pin} Share my location for this trip</button>`}
    <p class="demo-note">Your location is shared only with families in this commute, and only while this screen is open.</p>
    <${Action} onClick=${() => setTab('chat')}>Chat!<//>
  </main>`;
}

function Chat({ a }) {
  const [text, setText] = useState('');
  const [msgs, setMsgs] = useState(null);
  const box = useRef();
  const gid = a.gid;
  const people = a.people[gid] || [];
  useEffect(() => {
    if (!gid) return;
    q(sb.from('messages').select('*').eq('group_id', gid).order('created_at').limit(200)).then(setMsgs, e => { a.say(e.message); setMsgs([]); });
    const ch = sb.channel('chat-' + gid).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `group_id=eq.${gid}` }, (p) => setMsgs(m => (m || []).some(x => x.id === p.new.id) ? m : [...(m || []), p.new])).subscribe();
    return () => { sb.removeChannel(ch); };
  }, [gid]);
  useEffect(() => { if (box.current) box.current.scrollTop = box.current.scrollHeight; }, [msgs && msgs.length]);
  const send = async (e) => {
    e.preventDefault(); const t = text.trim(); if (!t) return;
    setText('');
    try { const row = await q(sb.from('messages').insert({ group_id: gid, sender_id: a.uid, body: t }).select().single()); setMsgs(m => (m || []).some(x => x.id === row.id) ? m : [...(m || []), row]); }
    catch (err) { a.say(err.message); setText(t); }
  };
  const name = (id) => (people.find(p => p.parent_id === id) || {}).first_name || 'A parent';
  const others = people.filter(p => p.parent_id !== a.uid && p.status === 'accepted');
  return html`<div class="card" style="padding:0;gap:0">
    <div class="row" style="padding:14px 16px;border-bottom:1px solid var(--line)">
      <${Avatar} name=${others.map(p => p.first_name).join(' ') || 'Group'} />

    </div>
    <form class="chat-input" style="padding:12px;border-top:1px solid var(--line)" onSubmit=${send}><input id="chat-text" placeholder="Write a message…" aria-label="Message" value=${text} onInput=${e => setText(e.target.value)} maxlength="2000" /><button class="btn sm" type="submit">Send</button></form>
  </div>`;
}

function NewChild({ a }) {

  const [tried, setTried] = useState(false);
  return html`<main class="screen">
    <div><h2 class="title">New child</h2><div class="crumbs"><b>Profile</b>•<span>Add child</span></div></div>
    <form class="card form" id="child-form" onSubmit=${async e => { e.preventDefault(); setTried(true); if (!f.name || !f.dob) return; await a.run(() => q(sb.from('children').insert({ parent_id: a.uid, name: f.name, dob: f.dob })), `${f.name} added`); await a.reload(); a.go('profile'); }}>
      <${Field} id="nc-name" label="First name" value=${f.name} onInput=${v => setF({ ...f, name: v })} err=${tried && !f.name && 'Enter a name'} />
      <${Field} id="nc-dob" label="Date of birth" type="date" value=${f.dob} onInput=${v => setF({ ...f, dob: v })} err=${tried && !f.dob && 'Pick a date'} />
      <p class="small muted" style="margin:0">Only you can see your children’s details. Families in your commute see how many children you have.</p>
    </form>
    <div class="action"><button class="btn" type="submit" form="child-form" disabled=${a.busy}>Add child</button></div>
  </main>`;
}

function Commutes({ a }) {
  const accepted = a.gid ? (a.people[a.gid] || []).filter(p => p.status === 'accepted' && p.parent_id !== a.uid) : [];
  return html`<main class="screen">
    <div><h2 class="title">Commutes</h2><div class="crumbs"><b>Dashboard</b>•<span>Commutes</span></div></div>
    <${GroupPicker} a=${a} />
    <div class="card">
      <div class="row"><span class="mode on" style="width:48px;height:48px;cursor:default">${MODE_ICON[a.commute.mode]}</span><div class="grow"><b>School run · ${a.school.name}</b><div class="muted small">${MODE_NAME[a.commute.mode]} · drop-off ${a.commute.drop_time} · pick-up ${a.commute.pick_time}</div></div></div>
      <div class="row between" style="display:flex"><span class="muted">Families sharing</span><b>${accepted.length + 1}</b></div>
      <div class="row" style="flex-wrap:wrap;gap:8px">${accepted.map(p => html`<span class="row" style="gap:6px;background:var(--surface);border-radius:20px;padding:4px 10px 4px 4px"><${Avatar} name=${p.first_name + ' ' + p.last_name} size="sm" /><span class="small">${p.first_name} ${p.last_name}</span></span>`)}</div>
      <div class="row" style="gap:8px"><button class="btn sm ghost" onClick=${() => a.go('calendar')}>Calendar</button><button class="btn sm ghost" onClick=${() => a.go('manage')}>Manage</button><button class="btn sm ghost" onClick=${() => a.go('setup')}>Edit</button></div>
    </div>
    ${a.gid && !(a.groups || []).find(g => g.id === a.gid).mine ? html`<button class="btn ghost" disabled=${a.busy} onClick=${async () => { await a.run(() => rpc('leave_group', { p_group: a.gid }), 'You left the commute'); await a.reload(); }}>Leave this commute</button>` : ''}
  </main>`;
}

function Notifications({ a }) {
  useEffect(() => { const t = setTimeout(async () => { if ((a.notifications || []).some(n => !n.read)) { try { await q(sb.from('notifications').update({ read: true }).eq('user_id', a.uid).eq('read', false)); a.reload(); } catch (e) {} } }, 1500); return () => clearTimeout(t); }, []);
  const icon = { invite: I.mail, swap: I.cal, rota: I.cal, chat: I.heart, school: I.school };
  return html`<main class="screen">
    <div><h2 class="title">Notifications</h2><div class="crumbs"><b>Dashboard</b>•<span>Notifications</span></div></div>
    <${PendingInvites} a=${a} />
    <${SwapRequests} a=${a} onDone=${() => a.reload()} />
    <div class="stack" style="gap:4px">${(a.notifications || []).map(n => html`<div class=${'notif' + (n.read ? '' : ' unread')}><span class="ico">${icon[n.kind] || I.bell}</span><div class="grow"><div>${n.body}</div><div class="small muted">${ago(n.created_at)}</div></div></div>`)}</div>
    ${!(a.notifications || []).length ? html`<p class="muted center">You’re all caught up.</p>` : ''}
  </main>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>

</body>
</html>
